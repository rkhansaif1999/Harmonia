  'OpenAI': `
    <div class="info-box"><div class="info-box-title">Company Overview</div><p>OpenAI is the AI research and deployment laboratory responsible for ChatGPT, GPT-4, and DALL-E. Founded in 2015, it transitioned from a non-profit to a "capped-profit" entity to secure the immense capital required for AI development. It is currently valued at over $80 billion.</p></div>
    <h2>History and Evolution</h2>
    <p>OpenAI was founded by Sam Altman, Elon Musk, Ilya Sutskever, and others with the mission to ensure Artificial General Intelligence (AGI) benefits all of humanity. Musk left in 2018 due to conflicts of interest. In 2019, OpenAI created OpenAI LP (a capped-profit company) to allow it to raise money from investors, capping returns at 100x. The 2022 launch of ChatGPT sparked the global AI boom, making OpenAI the most influential AI company in the world.</p>
    <h2>Core Products and Technologies</h2>
    <h3>1. The GPT Series</h3>
    <p>OpenAI's Generative Pre-trained Transformers (GPT) are the industry standard for Large Language Models. GPT-4 and its variants (like GPT-4o) power everything from their consumer chatbot to enterprise APIs.</p>
    <h3>2. DALL-E</h3>
    <p>A leading text-to-image generation model, integrated directly into ChatGPT and Microsoft's Bing/Image Creator.</p>
    <h3>3. Sora</h3>
    <p>A revolutionary text-to-video model capable of generating highly realistic, minute-long videos, demonstrating an understanding of physical world physics.</p>
    <h2>The Microsoft Partnership</h2>
    <p>Microsoft has invested over $13 billion in OpenAI. In exchange, Microsoft Azure is the exclusive cloud provider for OpenAI, and Microsoft integrates OpenAI's models into its entire product suite (Copilot). This partnership gives OpenAI the compute power it needs, while Microsoft leapfrogs Google in the AI race.</p>
    <h2>Careers and Remote Work</h2>
    <p>OpenAI hires heavily for AI research, software engineering, and "AI Training" (RLHF). While core research roles are onsite in San Francisco, they hire remote workers globally for domain-expert data annotation, red teaming, and prompt engineering through platforms like Outlier and Remotasks (Scale AI).</p>
    <div class="info-box"><div class="info-box-title">The AGI Mission</div><p>OpenAI's ultimate goal is AGI. They define this as highly autonomous systems that outperform humans at most economically valuable work. All their product launches are stepping stones toward this singular, transformative goal.</p></div>
  `,
  'Anthropic': `
    <div class="info-box"><div class="info-box-title">Company Overview</div><p>Anthropic is an AI safety company founded in 2021 by former OpenAI researchers, including siblings Dario and Daniela Amodei. It is the creator of the Claude family of Large Language Models and is widely considered OpenAI's biggest competitor in the foundation model space.</p></div>
    <h2>The Focus on Safety</h2>
    <p>Anthropic was born out of a disagreement over OpenAI's commercial direction. The founders left to create a company strictly focused on AI alignment and safety. They pioneered "Constitutional AI," a training method where the AI learns to self-correct its harmful outputs based on a set of human-written principles (a "constitution"), reducing the need for massive human RLHF datasets.</p>
    <h2>Core Products</h2>
    <h3>The Claude Model Family</h3>
    <p>Claude is Anthropic's flagship LLM. It has evolved rapidly from Claude 1 to the highly capable Claude 3 and 3.5 series. Claude is specifically prized by developers for its natural writing style (less robotic than ChatGPT), massive 200,000-token context window, and superior coding abilities.</p>
    <h3>The Claude API and Consumer App</h3>
    <p>Anthropic offers a developer API and a consumer-facing web app (Claude.ai) and iOS app. They also offer "Claude Team" plans for enterprise collaboration.</p>
    <h2>The Amazon and Google Alliance</h2>
    <p>To counter the Microsoft/OpenAI alliance, Amazon invested up to $4 billion in Anthropic, making Amazon Web Services (AWS) a primary cloud provider and Anthropic's custom chips (Trainium and Inferentia) a core part of their infrastructure. Google has also invested roughly $2 billion, securing a minority stake.</p>
    <h2>Careers and Remote Work</h2>
    <p>Anthropic heavily recruits "Subject Matter Experts" (SMEs) across fields like law, finance, medicine, and coding to train Claude. These roles are often remote, flexible, and pay exceptionally well (often $50-$100+/hr). They look for experts who can meticulously evaluate AI reasoning and catch subtle hallucinations.</p>
    <div class="info-box"><div class="info-box-title">Interpretability Research</div><p>Anthropic is a leader in "mechanistic interpretability"—the science of looking inside the neural network to understand exactly *why* the AI made a specific decision, aiming to solve the "black box" problem.</p></div>
  `,
  'Google': `
    <div class="info-box"><div class="info-box-title">Company Overview</div><p>Google (Alphabet Inc.) is the world's most ubiquitous search engine and cloud provider. After a brief period of being caught off guard by OpenAI, Google has aggressively mobilized its decade of AI research to defend its search monopoly and cloud business.</p></div>
    <h2>A Decade of AI Dominance</h2>
    <p>Google invented the Transformer architecture (the "T" in GPT) in 2017. For years, they used AI internally to improve Search, YouTube recommendations, and Google Photos. They hesitated to release a ChatGPT competitor due to "reputational risk" (fear of AI hallucinations damaging their brand), a delay they are currently correcting.</p>
    <h2>DeepMind and Google Brain Merger</h2>
    <p>Google owns DeepMind (the legendary UK lab that built AlphaGo) and Google Brain. In 2023, they merged these two massive teams into "Google DeepMind" to consolidate their talent and compute resources against OpenAI.</p>
    <h2>Core Products</h2>
    <h3>1. Gemini</h3>
    <p>Google's flagship multimodal LLM. Gemini is natively multimodal, meaning it was trained from the ground up to process text, images, audio, and video simultaneously. It powers the Gemini chatbot and is integrated into Google Workspace (Docs, Gmail).</p>
    <h3>2. Google Cloud Vertex AI</h3>
    <p>A massive enterprise platform allowing companies to build, train, and deploy their own machine learning models using Google's infrastructure.</p>
    <h2>Careers and Remote Work</h2>
    <p>Google hires thousands of remote contractors for AI training through vendors like Welocalize, Telus International, and Appen. These roles involve Search Quality Rating, Ads Evaluation, and training the Gemini model. They also hire top-tier AI researchers globally.</p>
    <div class="info-box"><div class="info-box-title">The Search Threat</div><p>Google's biggest existential threat is "AI Overviews." If users get their answers directly from an LLM instead of clicking blue links, Google's ad revenue model breaks. They are currently navigating how to integrate AI without killing their primary cash cow.</p></div>
  `,
  'Microsoft': `
    <div class="info-box"><div class="info-box-title">Company Overview</div><p>Microsoft, under CEO Satya Nadella, has transformed from a legacy Windows/Office company into the world's leading AI infrastructure provider. Their strategic partnership with OpenAI has positioned them at the forefront of the AI revolution.</p></div>
    <h2>The AI Pivot</h2>
    <p>Microsoft invested $1 billion in OpenAI in 2019, a bet that seemed insane at the time but has proven to be the most successful tech investment in history. They provide the massive Azure supercomputers that train OpenAI's models, and in return, they get exclusive rights to commercialize OpenAI's tech.</p>
    <h2>Copilot Everywhere</h2>
    <p>Microsoft's strategy is to integrate AI (branded as "Copilot") into every product they own:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>GitHub Copilot:</strong> The highly successful AI pair programmer that suggests code in real-time.</li>
      <li style="margin-bottom:8px;"><strong>Microsoft 365 Copilot:</strong> AI embedded in Word, Excel, PowerPoint, and Teams to draft documents and summarize meetings.</li>
      <li style="margin-bottom:8px;"><strong>Windows Copilot:</strong> A built-in AI assistant directly integrated into the Windows operating system.</li>
    </ul>
    <h2>Custom Silicon</h2>
    <p>To reduce reliance on NVIDIA, Microsoft has started designing its own AI chips, like the Azure Maia 100, specifically optimized for running OpenAI models.</p>
    <h2>Careers and Remote Work</h2>
    <p>Microsoft hires heavily for AI Cloud Architects, AI Engineers, and Enterprise Sales. A massive portion of their workforce is remote or hybrid. They also employ vast teams of data annotators and prompt engineers to refine Copilot's responses.</p>
    <div class="info-box"><div class="info-box-title">Enterprise Advantage</div><p>While OpenAI gets the consumer hype, Microsoft owns the enterprise distribution channel. Companies that already use Azure and Office 365 will naturally adopt Microsoft AI, making it the default for corporate America.</p></div>
  `,
  'Meta': `
    <div class="info-box"><div class="info-box-title">Company Overview</div><p>Meta (formerly Facebook), led by Mark Zuckerberg, has pivoted aggressively toward Artificial Intelligence. While still heavily invested in the Metaverse, Meta's open-source AI strategy has made it one of the most powerful forces in the AI landscape.</p></div>
    <h2>The Open-Source Strategy</h2>
    <p>Unlike OpenAI or Google, Meta releases its massive AI models for free. The Llama (Large Language Model Meta AI) series has democratized AI, allowing startups and researchers worldwide to build custom models without paying API fees to Big Tech. This strategy commoditizes the AI layer, preventing any single company from monopolizing it, which benefits Meta's core social media and ads business.</p>
    <h2>Core Technologies</h2>
    <h3>1. Llama Models</h3>
    <p>Llama 3 is widely considered the best open-weights model available. It rivals GPT-4 in reasoning but can be downloaded and run locally. Meta's Llama models have been downloaded tens of millions of times.</p>
    <h3>2. PyTorch</h3>
    <p>Meta created and open-sourced PyTorch, the dominant machine learning framework used by almost all AI researchers and developers today.</p>
    <h3>3. FAIR (Fundamental AI Research)</h3>
    <p>Meta's research lab, led by AI pioneer Yann LeCun, focuses on foundational science, including self-supervised learning and world models for robotics.</p>
    <h2>AI in Social Media</h2>
    <p>Meta uses AI internally to power the world's most lucrative recommendation algorithms (Facebook Feed, Instagram Reels, TikTok competitor) and to detect hate speech and misinformation at a scale impossible for human moderators.</p>
    <h2>Careers and Remote Work</h2>
    <p>Meta hires thousands of remote AI researchers and ML engineers. They also contract huge teams of data annotators (via vendors) to train their models and moderate content across Facebook and Instagram.</p>
  `,
  'NVIDIA': `
    <div class="info-box"><div class="info-box-title">Company Overview</div><p>NVIDIA, led by Jensen Huang, is the undisputed hardware king of the AI boom. Originally known for gaming graphics cards (GPUs), NVIDIA's hardware is the foundational compute required to train and run AI models, making it one of the most valuable companies on Earth.</p></div>
    <h2>The GPU Monopoly</h2>
    <p>While CPUs handle sequential tasks, GPUs perform thousands of parallel calculations simultaneously. This exact capability is required for the matrix multiplications used in deep learning. NVIDIA currently holds an estimated 80-90% market share for AI data center chips.</p>
    <h2>The CUDA Moat</h2>
    <p>NVIDIA's true advantage isn't just the silicon; it's the software. In 2006, NVIDIA released CUDA, a software platform that allows developers to write code directly for GPUs. Almost all AI frameworks (PyTorch, TensorFlow) are built on top of CUDA. This software ecosystem locks developers in, making it incredibly difficult to switch to competitor chips (like AMD or Google TPUs).</p>
    <h2>Core Products</h2>
    <h3>1. H100 and B200</h3>
    <p>The H100 is the workhorse chip of the current AI generation, costing upwards of $30,000 each. The newly announced Blackwell (B200) is the next generation, promising massive leaps in speed and efficiency.</p>
    <h3>2. Omniverse</h3>
    <p>A 3D collaboration platform for "digital twins," allowing companies to simulate physical factories or supply chains in a virtual world.</p>
    <h2>Careers and Remote Work</h2>
    <p>NVIDIA hires elite hardware engineers, CUDA software developers, and AI researchers. While hardware design is largely onsite, they offer many remote roles in software engineering, enterprise AI sales, and cloud infrastructure.</p>
    <div class="info-box"><div class="info-box-title">The Geopolitical Risk</div><p>NVIDIA's biggest challenge is geopolitics. The US government heavily restricts the export of high-end NVIDIA chips to China to prevent them from developing advanced AI for military purposes, cutting off a massive revenue stream.</p></div>
  `,
  'Amazon': `
    <div class="info-box"><div class="info-box-title">Company Overview</div><p>Amazon is the world's largest cloud provider (AWS) and e-commerce platform. While slower to launch a consumer-facing AI chatbot, Amazon is heavily focused on providing the underlying infrastructure for AI development and practical, enterprise AI solutions.</p></div>
    <h2>AWS: The AI Backbone</h2>
    <p>Amazon Web Services (AWS) powers a massive portion of the internet. They offer "Amazon Bedrock," a service that allows companies to access various AI models (from Anthropic, Meta, and Amazon itself) via a single API, using AWS security and compliance.</p>
    <h2>Custom Silicon (Annapurna Labs)</h2>
    <p>To reduce reliance on expensive NVIDIA chips, Amazon designs its own AI processors:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Trainium:</strong> Designed specifically for training massive machine learning models, offering better cost-performance than GPUs for certain tasks.</li>

    <h2>The Anthropic Alliance</h2>

    <h2>Practical AI Products</h2>

    <h2>Careers and Remote Work</h2>
    <p>Amazon hires massive numbers of remote Cloud Solutions Architects, ML Engineers, and AI Product Managers. They also utilize vendors like Appen heavily for Alexa voice data collection and search evaluation.</p>
  `,
  'Apple': `
    <div class="info-box"><div class="info-box-title">Company Overview</div><p>Apple, the world's most valuable consumer tech company, has taken a distinctly different path in the AI race. Rather than building massive cloud-based chatbots, Apple focuses on "on-device" AI, privacy, and seamlessly integrating intelligence into its hardware ecosystem.</p></div>
    <h2>Apple Intelligence</h2>
    <p>In 2024, Apple announced "Apple Intelligence," its suite of AI features deeply integrated into iOS, iPadOS, and macOS. It includes system-wide writing tools (rewrite, proofread, summarize), advanced Siri capabilities (understanding context across apps), and image generation (Genmoji).</p>
    <h2>The Privacy-First Approach</h2>
    <p>Apple's massive differentiator is privacy. Much of Apple's AI runs entirely on the device (using the Neural Engine in their M-series and A-series chips), meaning your data never goes to the cloud. For complex requests requiring cloud compute, Apple uses "Private Cloud Compute," ensuring data is processed securely and never stored or accessible to Apple.</p>
    <h2>The OpenAI Partnership</h2>
    <p>Recognizing it couldn't build a GPT-4 level model overnight, Apple partnered with OpenAI. When a user asks Siri a complex question that Apple's on-device AI can't handle, it offers to forward the query to ChatGPT. Apple handles the user interface and privacy wrappers, while OpenAI provides the cloud brain.</p>
    <h2>Silicon Supremacy</h2>
    <p>Apple's transition to its own silicon (M1, M2, M3, M4 chips) gives them a massive advantage in AI. Their "Unified Memory Architecture" allows MacBooks to access up to 128GB of RAM, making them incredibly powerful machines for running local, open-source AI models (like Llama 3) without needing expensive, dedicated graphics cards.</p>
    <div class="info-box"><div class="info-box-title">The Ecosystem Advantage</div><p>Apple doesn't need to win the AI chatbot war. By putting AI into the hands of billions of iPhone users to summarize emails, edit photos, and navigate apps, Apple normalizes AI for the masses in a way Google and OpenAI cannot.</p></div>
  `,

  'Getting Started': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>Welcome to Harmonia! This guide will walk you through the absolute basics of setting up your account, navigating the platform, and claiming your first task so you can start earning immediately.</p></div>
    <h2>Step 1: Account Creation</h2>
    <p>Sign up using your email address. Choose a strong password. Immediately check your inbox for a verification email to activate your account. You cannot claim tasks until your email is verified.</p>
    <h2>Step 2: Profile Setup</h2>
    <p>Navigate to "Settings" to complete your profile. You must add your full legal name (for tax and KYC purposes), your country of residence, and your primary language. The more accurate your profile, the better Harmonia's algorithm can match you with relevant tasks.</p>
    <h2>Step 3: Taking the Base Assessment</h2>
    <p>Before you can do any work, you must pass the "Harmonia General Assessment." This is a 15-minute, open-book test on basic platform rules and data annotation logic. You have three attempts. Score 85% or higher to unlock the main task queue.</p>
    <h2>Step 4: Claiming Your First Task</h2>
    <p>Go to the "Dashboard." Filter tasks by "Beginner Level." Click "Accept" on a task. Read the guidelines carefully, complete the task, and hit "Submit." Your first task will be reviewed by a Senior Annotator within 24 hours.</p>
    <div class="info-box"><div class="info-box-title">Pro Tip</div><p>Don't rush your first task. Your initial accuracy score determines your starting Level, which directly impacts how much you get paid per task moving forward.</p></div>

  'Worker Guide': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>This guide is for freelance workers (Annotators, AI Trainers, Evaluators) looking to maximize their earnings and maintain a high quality score on the Harmonia platform.</p></div>
    <h2>Finding the Right Tasks</h2>
    <p>Not all tasks are created equal. Use the filters to find tasks that match your skill set. If you are a fast typer, look for transcription or prompt writing. If you are highly analytical, look for RLHF response rankings. Always check the "Estimated Time" vs. "Payout" to calculate your effective hourly rate.</p>
    <h2>The Submission Lifecycle</h2>
    <ol style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Accepted:</strong> You have claimed the task. You now have a set time limit (e.g., 2 hours) to complete it.</li>
      <li style="margin-bottom:8px;"><strong>In Review:</strong> You submitted the task. It is now being graded by a Quality Assurance (QA) reviewer or an AI judge.</li>
      <li style="margin-bottom:8px;"><strong>Approved:</strong> You passed! Funds are credited to your wallet.</li>
      <li style="margin-bottom:8px;"><strong>Rejected:</strong> You failed to meet the guidelines. Funds are not credited, and your accuracy score drops.</li>
    </ol>
    <h2>Maintaining Your Account</h2>
    <p>Harmonia requires a rolling 90% accuracy rate. If you drop below this, you will receive a warning. If you drop below 80%, your account will be temporarily suspended, and you will need to retake the base assessment.</p>
  `,
  'Client Guide': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>This guide is for companies, researchers, and project managers looking to use Harmonia to source high-quality AI training data and annotation services.</p></div>
    <h2>Setting Up a Project</h2>
    <p>Navigate to the "Client Portal" and click "New Project." You will need to define your project type (e.g., Image Bounding Boxes, Text RLHF), upload your raw dataset, and write the Annotation Guidelines.</p>
    <h2>Pricing and Budgeting</h2>
    <p>You set the price per task. Harmonia provides a recommended payout based on task complexity and estimated completion time. Higher-paying tasks attract higher-level, more accurate workers. You must deposit your budget upfront into an escrow account.</p>
    <h2>Quality Control Settings</h2>
    <p>You can configure how your data is reviewed:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Consensus:</strong> 3 workers complete the same task; the system accepts the majority answer.</li>
      <li style="margin-bottom:8px;"><strong>Gold Standard:</strong> Mix pre-answered "trap" tasks into the queue to automatically filter out bad workers.</li>
      <li style="margin-bottom:8px;"><strong>Manual Review:</strong> A Harmonia Senior Annotator reviews every submission before it is sent to you.</li>

  `,
  'Wallet': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>The Harmonia Wallet is your digital financial hub. It tracks your earnings, pending payouts, and allows you to withdraw your funds to external payment platforms.</p></div>

    <p>Your wallet balance is split into two categories:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Available Balance:</strong> Funds from approved tasks that are ready for immediate withdrawal.</li>

    <p>Harmonia supports multiple payout gateways to ensure global accessibility:</p>

  `,
  'Reviews': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>The Review system is the backbone of Harmonia's quality assurance. Every task submitted by a worker is reviewed to ensure it meets the client's guidelines before funds are released.</p></div>
    <h2>Who Does the Reviewing?</h2>
    <h3>1. Automated AI Review</h3>
    <p>For simple tasks (like image classification), an AI model instantly checks your work against a known dataset. If you match the AI's prediction, you are approved instantly.</p>
    <h3>2. Peer Review (Senior Annotators)</h3>
    <p>For complex tasks (like RLHF or coding), your work is sent to a Level 4 or 5 worker. They act as a QA agent, reviewing your submission against the rubric.</p>
    <h3>3. Client Review</h3>
    <p>For high-stakes, enterprise data, the client themselves reviews the final output before approving the batch.</p>
    <h2>Handling Feedback</h2>
    <p>If your task is rejected, the reviewer must leave a reason. You can view this feedback in your "Task History." Do not argue with reviewers in the comments; use the feedback to improve your next submission. If you believe the reviewer made a mistake, use the "Appeals" system.</p>
  `,
  'Payments': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>Understanding the Harmonia payment cycle ensures you know exactly when and how you will be paid for your hard work.</p></div>
    <h2>The Payment Cycle</h2>
    <p>Harmonia operates on a rolling payment system. There are no set "paydays." The moment a task is approved by a reviewer, the funds move from your "Pending Balance" to your "Available Balance" in your Wallet.</p>
    <h2>Task Payouts</h2>
    <p>Payouts are clearly displayed before you accept a task. Payouts are calculated based on:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Complexity:</strong> Drawing a bounding box pays less than writing a Python script.</li>
      <li style="margin-bottom:8px;"><strong>Estimated Time:</strong> Longer tasks pay more.</li>
      <li style="margin-bottom:8px;"><strong>Your Level:</strong> Higher-level workers receive a multiplier (e.g., Level 5 gets a 20% bonus).</li>

    <h2>Tax Documentation</h2>

  `,
  'Referrals': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>The Harmonia Referral Program allows you to earn passive income by inviting friends and colleagues to join the platform.</p></div>
    <h2>How It Works</h2>

  `,
  'Dashboard': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>The Harmonia Dashboard is your mission control. It is designed to give you a real-time overview of your tasks, earnings, and performance metrics.</p></div>
    <h2>Key Sections</h2>
    <h3>1. The Task Queue</h3>
    <p>This is the main feed of available work. Use the sidebar filters to sort by category (Text, Image, Audio), payout amount, or difficulty level. Tasks disappear fast, so refresh this page frequently.</p>
    <h3>2. Active Tasks</h3>
    <p>If you have accepted a task but haven't finished it, it lives here. You can see the countdown timer for each active task. If the timer expires, the task is returned to the public queue and your accuracy drops.</p>

  'Levels': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>Harmonia uses a 5-Tier Level system to gamify the work experience and reward high-quality annotators. Your Level dictates which tasks you can access and how much you get paid.</p></div>
    <h2>The Level System</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Level 1 (Beginner):</strong> Unlocked after passing the base assessment. Access to basic microtasks. Standard pay.</li>
      <li style="margin-bottom:8px;"><strong>Level 2 (Intermediate):</strong> Requires 100 approved tasks and 90% accuracy. Unlocks transcription and basic image annotation.</li>
      <li style="margin-bottom:8px;"><strong>Level 3 (Advanced):</strong> Requires 500 approved tasks and 95% accuracy. Unlocks RLHF ranking and prompt writing. +5% pay multiplier.</li>

      <li style="margin-bottom:8px;"><strong>Level 5 (QA / Senior):</strong> Invite-only. These users review the work of Level 1-4 workers. +20% pay multiplier.</li>

    <h2>Leveling Up</h2>
    <p>You level up automatically once you hit the task count and accuracy thresholds. However, you can be demoted if your rolling accuracy drops below the threshold for your current level.</p>
  `,
  'Badges': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>Badges are special achievements on your Harmonia profile that highlight specific skills or milestones. They act as micro-certifications for clients looking for specialized workers.</p></div>
    <h2>How to Earn Badges</h2>
    <p>Badges are earned by passing specialized, unpaid certification exams in the "Academy" tab. Once earned, they are displayed on your public worker profile.</p>
    <h2>Types of Badges</h2>
    <h3>1. Skill Badges</h3>
    <p><strong>Polygons Pro:</strong> Passed the complex polygon annotation test.<br><strong>Python Evaluator:</strong> Can review AI-generated Python code.<br><strong>Medical NER:</strong> Certified to annotate medical text records.</p>
    <h3>2. Milestone Badges</h3>
    <p><strong>Night Owl:</strong> Completed 100 tasks between midnight and 4 AM.<br><strong>Speed Demon:</strong> Completed a task in the top 1% of fastest times (without losing accuracy).<br><strong>Flawless:</strong> 500 consecutive approvals without a single rejection.</p>
    <div class="info-box"><div class="info-box-title">The Benefit of Badges</div><p>Clients can filter the worker pool by Badges. If a client posts a project requiring "Python Evaluator" badge, only workers with that badge will see the task. This drastically reduces competition and guarantees higher-quality, higher-paying work.</p></div>
  `,
  'Quality Standards': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>Harmonia enforces strict Quality Standards because the AI models trained on our data require flawless input. "Good enough" is not acceptable.</p></div>
    <h2>The 95% Rule</h2>
    <p>To remain in good standing, workers must maintain a minimum 95% task approval rate over their last 100 tasks. If you fall below this, you will be placed in a "Probation" status, meaning you can only do Level 1 tasks until your score recovers.</p>
    <h2>Common Causes for Rejection</h2>
    <h3>1. Tight Fitting (Image Tasks)</h3>
    <p>Leaving too much background space inside a bounding box or polygon. Boxes must hug the pixels of the object tightly.</p>
    <h3>2. Hallucination (Text Tasks)</h3>
    <p>When asked to verify an AI's fact, simply agreeing with the AI without actually Googling the answer. If the AI hallucinates and you approve it, you are rejected.</p>
    <h3>3. Ignoring Edge Cases</h3>
    <p>If an object is 80% off-screen, the guidelines likely state you should still draw a box to the edge of the image. Skipping it because it's "too hard" is a rejection.</p>
    <h3>4. Speed Over Quality</h3>
    <p>Completing a 5-minute task in 30 seconds. Harmonia's backend tracks time-on-task. Suspiciously fast submissions are auto-rejected.</p>
  `,
  'Rules': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>Harmonia has a zero-tolerance policy for fraud and cheating. Breaking these rules will result in an immediate, permanent ban and forfeiture of any funds in your wallet.</p></div>
    <h2>Prohibited Actions</h2>
    <h3>1. Multi-Accounting</h3>
    <p>You are strictly limited to ONE account per person. Creating multiple accounts to farm sign-up bonuses or bypass accuracy bans is tracked via IP, device fingerprinting, and payment methods.</p>
    <h3>2. Using AI to Do Your Work</h3>
    <p>Using ChatGPT or Claude to generate prompts, write code, or answer evaluation tasks on Harmonia is strictly forbidden. The platform uses advanced AI-detection software. If you are caught using AI to do AI training tasks, you will be banned instantly.</p>
    <h3>3. Sharing Accounts / Credentials</h3>
    <p>You cannot share your account with a friend or family member to complete tasks faster. Your account is tied to your verified identity.</p>
    <h3>4. Communicating Outside the Platform</h3>
    <p>Workers and clients must not communicate or process payments outside of the Harmonia platform. This is to prevent scams and tax evasion.</p>
    <div class="info-box"><div class="info-box-title">Appeals</div><p>If you believe you were falsely banned for multi-accounting (e.g., a family member in the same house uses the platform), you can appeal by providing separate ID documents.</p></div>
  `,
  'Appeals': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>Sometimes, reviewers make mistakes. If you strongly believe a task you submitted was incorrectly rejected, you have the right to file an Appeal.</p></div>
    <h2>How to File an Appeal</h2>
    <p>Go to your "Task History" tab. Find the rejected task and click the "Appeal" button. You will be given a text box to write your justification. You must cite the specific rule from the guidelines that proves your work was correct.</p>
    <h2>The Appeal Process</h2>
    <ol style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;">The task and your appeal are sent to a Senior QA Manager (Level 5).</li>
      <li style="margin-bottom:8px;">The Manager reviews the original guidelines, your submission, and the reviewer's reason for rejection.</li>
      <li style="margin-bottom:8px;">The Manager makes a final ruling. There is no further appeal.</li>
    </ol>
    <h2>Outcomes</h2>
    <p>If you <strong>win</strong> the appeal, the task is marked as approved, funds are deposited, and your accuracy score is restored. The reviewer's accuracy score is penalized.</p>
    <p>If you <strong>lose</strong> the appeal, the rejection stands. If Harmonia detects you are spamming the appeal button for tasks you clearly failed, you will lose your appeal privileges.</p>
    <div class="info-box"><div class="info-box-title">Tip</div><p>Do not appeal out of emotion. Only appeal if you can factually prove the reviewer ignored a specific guideline.</p></div>
  `,
  'Verification': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>KYC (Know Your Customer) Verification is a mandatory legal requirement to work on Harmonia. You cannot withdraw any earnings until your identity is verified.</p></div>
    <h2>Why We Verify</h2>
    <p>Verification protects the platform from fraud, money laundering, and bots. It ensures that the person getting paid is the actual person doing the work, and that workers are old enough to legally work.</p>
    <h2>How to Get Verified</h2>

  'Attention Is All You Need': `
    <div class="info-box"><div class="info-box-title">Paper Overview</div><p>Published in 2017 by researchers at Google Brain, "Attention Is All You Need" is arguably the most important AI paper of the last decade. It introduced the <strong>Transformer</strong> architecture, completely replacing the RNNs (Recurrent Neural Networks) that came before it and enabling the modern Generative AI boom.</p></div>
    <h2>The Problem with RNNs</h2>
    <p>Before 2017, AI models that processed text (like translators) used RNNs or LSTMs. These models read text sequentially—word by word. This meant two things: they were incredibly slow to train (you couldn't process word 2 until word 1 was done), and they "forgot" early words in a long sentence.</p>
    <h2>The Innovation: Self-Attention</h2>
    <p>The paper proposed dropping the sequential reading entirely. Instead, the Transformer looks at all words in a sentence simultaneously and uses a mathematical mechanism called <strong>Self-Attention</strong> to weigh the importance of every word relative to every other word.</p>
    <h3>Example</h3>
    <p>In the sentence "The bank of the river was muddy," the word "bank" is ambiguous. The self-attention mechanism allows the model to mathematically link "bank" strongly to "river," ensuring it understands the correct context. It doesn't matter how far apart the words are; attention connects them instantly.</p>
    <h2>Parallelization</h2>
    <p>Because the Transformer processes all words at once, it can be trained using massive parallel processing on GPUs. This allowed researchers to scale up dataset sizes from gigabytes to terabytes, unlocking the emergent reasoning abilities of modern LLMs.</p>
  `,
  'GPT Architecture': `
    <div class="info-box"><div class="info-box-title">Paper Overview</div><p>The GPT (Generative Pre-trained Transformer) series, pioneered by OpenAI, represents the practical application of the Transformer architecture to create conversational AI. The foundational papers (GPT-1, GPT-2, and GPT-3) established the "pre-train then fine-tune" paradigm that dominates the industry today.</p></div>
    <h2>The "Decoder-Only" Approach</h2>
    <p>The original Transformer had two parts: an Encoder (for reading) and a Decoder (for writing). OpenAI realized that for a text-generation model, they only needed the Decoder. GPT models are "autoregressive," meaning they predict the next word in a sequence, add it to the prompt, and repeat the process.</p>
    <h2>The Two-Step Training Process</h2>
    <h3>1. Pre-training (Unsupervised)</h3>
    <p>OpenAI fed the model terabytes of raw internet text. The model played a massive game of "fill in the blank" (predicting masked words). This took months of supercomputer processing and cost millions of dollars. The result is a "base model" that understands grammar, facts, and reasoning, but doesn't know how to be helpful.</p>
    <h3>2. Fine-tuning (Supervised & RLHF)</h3>
    <p>The base model is raw and chaotic. OpenAI human experts wrote thousands of perfect prompt-and-response pairs to teach the model the format of being a Q&A assistant. They then used Reinforcement Learning from Human Feedback (RLHF) to align the model's outputs with human preferences for helpfulness and safety.</p>
    <h2>Scaling Laws</h2>
    <p>The GPT papers proved the "Scaling Laws": if you increase the model's parameters (size), the training data, and the compute power simultaneously, the model gets exponentially smarter. This discovery led directly to the arms race to build massive data centers.</p>
  `,
  'Transformer Models': `
    <div class="info-box"><div class="info-box-title">Paper Overview</div><p>Beyond just GPT, the Transformer architecture introduced in 2017 spawned an entire family of models. This article explains the different branches of the Transformer family tree and how they evolved for different tasks.</p></div>
    <h2>Encoder-Only Models (BERT)</h2>
    <p>While OpenAI focused on the Decoder for text generation, Google focused on the Encoder to create <strong>BERT</strong> (Bidirectional Encoder Representations from Transformers). BERT reads the entire sentence at once, looking both left and right. This makes it exceptional at understanding context.</p>
    <h3>Use Cases for BERT</h3>
    <p>BERT is not designed to write essays. It is designed for classification, sentiment analysis, and search. Google Search uses BERT to understand the intent behind your search queries to return better results.</p>
    <h2>Decoder-Only Models (GPT, Llama)</h2>
    <p>These models read left-to-right and predict the next token. They are the standard for generative AI. Almost all modern chatbots (ChatGPT, Claude, Gemini) are now built on Decoder-only architectures because they scale better for open-ended generation.</p>
    <h2>Encoder-Decoder Models (T5, BART)</h2>
    <p>These models retain the original 2017 design. The Encoder reads the input prompt, and the Decoder generates the output. They are highly effective for translation (converting English to French) and summarization, though they have largely fallen out of favor for general chatbots.</p>
    <div class="info-box"><div class="info-box-title">The Trend</div><p>While early AI used specialized models for specific tasks (BERT for search, T5 for translation), the modern trend is "decoder-only everything." Massive GPT-style models are proving capable of mastering all tasks, making specialized models obsolete.</p></div>
  `,
  'Diffusion Models': `
    <div class="info-box"><div class="info-box-title">Paper Overview</div><p>Diffusion Models are the mathematical foundation behind modern AI image generators like Midjourney, DALL-E 3, and Stable Diffusion. The core concept—adding noise to data and then learning to reverse it—was a breakthrough in generative visual art.</p></div>
    <h2>How Diffusion Works</h2>
    <p>Imagine a drop of ink falling into a glass of water. It slowly spreads until the water is uniformly cloudy. This is adding noise (Gaussian blur) to an image until it is pure static.</p>
    <h3>The Forward Process (Training)</h3>
    <p>During training, the AI is shown a clear image. Step by step, noise is added until the image is entirely destroyed. The AI's job is to learn the math of *how* the noise was added at each step.</p>
    <h3>The Reverse Process (Generation)</h3>
    <p>When you ask the AI to generate an image, it starts with a screen of pure TV static. Guided by your text prompt, the AI slowly removes the noise, step by step, "denoising" the static until a coherent, brand-new image emerges.</p>
    <h2>Latent Diffusion (Stable Diffusion)</h2>
    <p>Running diffusion on full-resolution images requires immense RAM. Researchers invented "Latent Diffusion," which compresses the image into a smaller mathematical "latent space" before adding noise. This is why Stable Diffusion can run on a consumer laptop GPU instead of a massive data center.</p>
    <h2>The U-Net Architecture</h2>
    <p>The brain of a diffusion model is the U-Net. It looks at the noisy image, looks at your text prompt, and predicts what noise to subtract. The U-Net does this repeatedly until the image is clean.</p>
  `,
  'Constitutional AI': `
    <div class="info-box"><div class="info-box-title">Paper Overview</div><p>Published by Anthropic in 2022, "Constitutional AI" introduced a novel method for training AI models to be harmless and helpful without relying entirely on massive, expensive human feedback datasets. It is the foundation of Anthropic's Claude model.</p></div>
    <h2>The Problem with RLHF</h2>
    <p>Standard RLHF requires thousands of human workers to rank AI responses continuously. This is slow, incredibly expensive, and subjective. Furthermore, humans are bad at red-teaming; we often miss dangerous edge cases that a model might output.</p>
    <h2>RLAIF (Reinforcement Learning from AI Feedback)</h2>
    <p>Anthropic's solution is RLAIF. Instead of asking a human to rank responses, they ask a second AI model to do it. The AI evaluates its own outputs based on a short list of principles, or a "Constitution."</p>
    <h2>How the Constitution Works</h2>
    <p>The constitution is a set of rules like:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;">"Please choose the response that is the least harmful."</li>
      <li style="margin-bottom:8px;">"Please choose the response that is most helpful and honest."</li>
      <li style="margin-bottom:8px;">"Please choose the response that is least racially biased."</li>
    </ul>
    <p>When the main AI generates two responses, the critic AI reviews them against the constitution, picks the better one, and explains why. The main AI then learns from this feedback, aligning itself automatically.</p>
    <h2>Why It Matters</h2>
    <p>Constitutional AI allows companies to scale AI safety training much faster and cheaper than pure human RLHF. It also results in models that are less "preachy" or robotic, as they are learning internal principles rather than just trying to please human annotators.</p>
  `,

  'CPUs': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>The CPU (Central Processing Unit) is the "brain" of a computer. It executes instructions, performs calculations, and manages the flow of data through the system. Every action you take—from moving a mouse to running an AI model—relies on the CPU.</p></div>
    <h2>Cores and Threads</h2>
    <p>Historically, a CPU had one core, meaning it could do one thing at a time. Today, CPUs have multiple cores (e.g., 6, 8, 16, or more). Each core is a separate processing unit. Furthermore, modern CPUs support "Hyper-Threading" (or Simultaneous Multithreading), allowing a single physical core to act as two virtual cores. An 8-core/16-thread CPU can process 16 streams of data simultaneously, making it vastly superior for multitasking and heavy workloads like video editing or compiling code.</p>
    <h2>Clock Speed (GHz)</h2>
    <p>Measured in Gigahertz (GHz), clock speed dictates how many instructions a core can execute per second. A 3.5 GHz CPU executes 3.5 billion cycles per second. While higher clock speeds generally mean a faster computer, you can only compare clock speeds between CPUs of the same generation and architecture.</p>
    <h2>AI and the CPU</h2>
    <p>While CPUs are versatile, they are not the best choice for training massive AI models. A CPU is designed to handle complex, sequential logic. AI training requires millions of simple, parallel calculations, which is why GPUs are preferred. However, CPUs are still required to manage the overall system and feed data to the GPUs.</p>
  `,
  'GPUs': `
    <h2>Overview</h2>
    <p>The GPU (Graphics Processing Unit) is a specialized processor originally designed to render images and video. However, its unique architecture has made it the single most important piece of hardware for Artificial Intelligence and machine learning.</p>
    <h2>Why GPUs Rule AI</h2>
    <p>A CPU has a few very powerful cores designed for complex, sequential tasks. A GPU has thousands of smaller, less complex cores designed to do many simple tasks at the exact same time (parallel processing). Rendering an image requires calculating the color of millions of pixels simultaneously—a perfect job for a GPU. Because neural networks rely on massive matrix multiplications (billions of simple math problems done at once), GPUs are exponentially faster than CPUs for AI training.</p>
    <h2>NVIDIA vs. AMD vs. Apple</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>NVIDIA:</strong> The undisputed king of AI. Their CUDA software platform is the industry standard. Almost all enterprise AI training runs on NVIDIA data center GPUs (like the A100 or H100).</li>
      <li style="margin-bottom:8px;"><strong>AMD:</strong> Excellent GPUs for gaming, but historically lacked the software ecosystem for AI. They are currently investing heavily in their ROCm platform to compete with NVIDIA.</li>
      <li style="margin-bottom:8px;"><strong>Apple Silicon (M-series):</strong> Apple's unified memory architecture allows MacBooks to access massive amounts of RAM (up to 128GB), making them surprisingly capable for running (inference) large local LLMs, though they cannot train them as fast as NVIDIA cards.</li>
    </ul>
    <div class="info-box"><div class="info-box-title">VRAM is Everything</div><p>For AI, the most critical spec of a GPU is VRAM (Video RAM). A model's weights must be loaded into VRAM to run. A 12GB GPU simply cannot run a 70-billion parameter model, no matter how fast the processor is. More VRAM = bigger models.</p></div>
  `,
  'RAM': `
    <h2>Overview</h2>
    <p>RAM (Random Access Memory) is your computer's short-term, high-speed working memory. It temporarily stores the data and code the CPU needs to access immediately. Unlike a hard drive, RAM is volatile—its contents are wiped the moment the computer loses power.</p>
    <h2>The Desk Analogy</h2>
    <p>Imagine your hard drive is a filing cabinet, and your CPU is you. RAM is your desk. If you have a tiny desk (4GB RAM), you can only open one or two files at a time. If you try to open more, you have to constantly swap files back to the cabinet, slowing you down. If you have a massive desk (32GB RAM), you can spread out dozens of files, a browser with 50 tabs, and a video editor all at once without lag.</p>
    <h2>Capacity vs. Speed</h2>
    <p>For most remote workers, 16GB of RAM is the sweet spot. 8GB is no longer enough for modern web browsing. If you are a developer running Docker containers, a video editor, or an AI researcher running local models, 32GB or 64GB is required. While RAM speed (measured in MHz) does impact performance, having *enough* RAM is vastly more important than having slightly faster RAM.</p>
    <div class="info-box"><div class="info-box-title">The Swap File (Virtual Memory)</div><p>When you run out of physical RAM, the operating system uses a "Swap File" on your SSD as overflow RAM. Because SSDs are vastly slower than physical RAM, hitting the swap file causes massive performance drops (lagging, freezing). If you hear your computer's fans spinning up and everything slows down, you likely need more RAM.</p></div>
  `,
  'SSDs': `
    <h2>Overview</h2>
    <p>An SSD (Solid State Drive) is a modern storage device that uses NAND flash memory to store data persistently. It has entirely replaced the mechanical Hard Disk Drive (HDD) for operating system installations and primary storage due to its blazing speed.</p>
    <h2>Why SSDs are Superior</h2>
    <p>HDDs use spinning magnetic platters and a physical moving arm to read/write data. This mechanical process is slow and prone to physical damage. SSDs have no moving parts; they store data in electrical cells. An SSD can boot a computer in seconds, open applications instantly, and transfer files at speeds of 500 MB/s to 7,000 MB/s.</p>
    <h2>SATA vs. NVMe</h2>
    <h3>1. SATA SSDs</h3>
    <p>The older generation. They use the same SATA interface as HDDs, capping their speeds at around 550 MB/s. They are cheap and great for upgrading old laptops.</p>
    <h3>2. NVMe SSDs (M.2)</h3>
    <p>The modern standard. NVMe drives connect directly to the motherboard's PCIe lanes. A Gen 4 NVMe drive can hit speeds of 7,000 MB/s—over 12 times faster than SATA. This is crucial for loading massive video game textures or fast AI dataset retrieval.</p>
    <h2>Lifespan (TBW)</h3>
    <p>Unlike HDDs, SSDs degrade slightly every time you write data to them. SSDs are rated by TBW (Terabytes Written). A 1TB SSD might have a 600 TBW rating, meaning you can write 600 Terabytes of data to it before it is likely to fail. For normal users, an SSD will last a decade. For AI servers constantly writing logs, lifespan management is critical.</p>
  `,
  'HDDs': `
    <h2>Overview</h2>
    <p>The HDD (Hard Disk Drive) is the traditional, mechanical storage device. While banished from the role of boot drives in modern computers, HDDs remain highly relevant for mass, cold storage.</p>
    <h2>How They Work</h2>
    <p>Inside an HDD are metal or glass platters coated in a magnetic material. These platters spin at high speeds (typically 5,400 or 7,200 RPM). A tiny mechanical arm (actuator) hovers micrometers above the platter, using an electromagnetic head to magnetize or read the domains on the disk.</p>
    <h2>Why They Are Still Used</h2>
    <p>While they are incredibly slow compared to SSDs, HDDs have one major advantage: cost per gigabyte. A 16TB SSD costs thousands of dollars. A 16TB HDD costs around $200. For data centers storing exabytes of user photos (like Facebook or Google Photos), or for AI companies storing raw, unstructured video data that doesn't need to be accessed instantly, HDDs are the only economically viable option.</p>
    <h2>The Danger of Moving Parts</h2>
    <p>Because they rely on physical mechanics, HDDs are fragile. Dropping a running HDD can cause the read head to crash into the platter, destroying the disk and losing all data. They also generate noise, heat, and consume more electricity than SSDs. For a remote worker, an HDD should only be used as a secondary backup drive, never the primary OS drive.</p>
  `,
  'Cloud Computing': `
    <h2>Overview</h2>
    <p>Cloud Computing is the delivery of computing services—including servers, storage, databases, networking, software, and AI—over the internet ("the cloud"). Instead of buying and maintaining physical servers in your office, you rent access to these resources from a cloud provider.</p>
    <h2>The Core Models</h2>
    <h3>1. IaaS (Infrastructure as a Service)</h3>
    <p>The most basic level. You rent raw virtual machines (VMs), storage, and networking. You must install the OS and software yourself. Example: Amazon EC2.</p>
    <h3>2. PaaS (Platform as a Service)</h3>
    <p>The provider manages the underlying infrastructure and operating system. You just deploy your application code. Ideal for developers who don't want to manage servers. Example: Google App Engine or Heroku.</p>
    <h3>3. SaaS (Software as a Service)</h3>
    <p>Fully functional software accessed via a browser. The provider handles everything. Examples: Gmail, Salesforce, Notion, or ChatGPT.</p>
    <h2>The Big Three Providers</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>AWS (Amazon Web Services):</strong> The dominant market leader with the widest array of services.</li>
      <li style="margin-bottom:8px;"><strong>Microsoft Azure:</strong> Deeply integrated with enterprise Windows environments.</li>
      <li style="margin-bottom:8px;"><strong>Google Cloud Platform (GCP):</strong> Strong in data analytics, machine learning (TensorFlow), and AI.</li>
    </ul>
    <div class="info-box"><div class="info-box-title">Pay-as-you-go</div><p>The beauty of the cloud is elasticity. If you need 100 servers to render a video for 3 hours, you spin them up, render the video, and shut them down. You only pay for the 3 hours of usage. This eliminates massive upfront capital expenditures.</p></div>
  `,
  'APIs': `
    <h2>Overview</h2>
    <p>An API (Application Programming Interface) is a set of rules and protocols that allows different software applications to communicate with each other. It is the invisible bridge that allows modern software to function.</p>
    <h2>The Restaurant Analogy</h2>
    <p>Imagine you are a customer at a restaurant. You (the application) want to order food (data) from the kitchen (the server/database). You cannot just walk into the kitchen and cook it yourself. You need a waiter (the API). You give the waiter your order (an API Request), the waiter takes it to the kitchen, the kitchen prepares the food, and the waiter brings it back to you (an API Response).</p>
    <h2>REST APIs</h2>
    <p>The most common type of web API is a REST API (Representational State Transfer). It uses standard HTTP methods to interact with data:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>GET:</strong> Retrieve data (e.g., fetch a user's profile).</li>
      <li style="margin-bottom:8px;"><strong>POST:</strong> Create new data (e.g., submit a new tweet).</li>
      <li style="margin-bottom:8px;"><strong>PUT/PATCH:</strong> Update existing data (e.g., change a password).</li>
      <li style="margin-bottom:8px;"><strong>DELETE:</strong> Remove data (e.g., delete a photo).</li>
    </ul>
    <h2>How AI Uses APIs</h2>
    <p>When you use ChatGPT, you are interacting with OpenAI's API. You send a POST request containing your prompt as a JSON payload. OpenAI's servers receive it, run the LLM, and return the generated text as a JSON response. This allows developers to integrate powerful AI into their own apps without building the AI from scratch.</p>
  `,
  'Databases': `
    <h2>Overview</h2>
    <p>A database is an organized collection of structured or unstructured data, stored electronically. It is the foundation of almost every website and application, allowing for efficient storage, retrieval, and management of information.</p>
    <h2>Relational (SQL) vs. Non-Relational (NoSQL)</h2>
    <p>Databases are generally divided into two main types, based on how they structure data.</p>
    <h3>1. Relational Databases (SQL)</h3>
    <p>Data is organized into strict tables with rows and columns, much like an Excel spreadsheet. They enforce strict schemas—if a column is for integers, you cannot put text there. They use Structured Query Language (SQL) to query data. They are excellent for complex relationships and financial transactions where data integrity (ACID) is paramount. Examples: MySQL, PostgreSQL, Oracle.</p>
    <h3>2. Non-Relational Databases (NoSQL)</h3>
    <p>Data is stored in flexible, document-oriented or key-value structures. There is no strict schema; you can add new fields to one record without affecting others. They are designed for massive horizontal scaling and rapid development. Examples: MongoDB (documents), Redis (key-value), Neo4j (graphs).</p>
    <h2>Vector Databases (The AI Era)</h2>
    <p>A new breed of database designed specifically for AI. Instead of storing text or numbers, they store vector embeddings (arrays of numbers representing semantic meaning). Vector databases (like Pinecone or Milvus) are the core technology behind Retrieval-Augmented Generation (RAG), allowing AI to search millions of documents by semantic meaning rather than keywords.</p>
  `,
  'SQL': `
    <h2>Overview</h2>
    <p>SQL (Structured Query Language) is the standard programming language used to communicate with relational databases. It allows developers and data analysts to insert, search, update, and delete database records.</p>
    <h2>How It Works</h2>
    <p>SQL operates using declarative syntax. You tell the database *what* data you want, and the database engine figures out *how* to retrieve it. For example, if you want to find all users in New York who spent over $100, the query looks like this:</p>
    <p><code>SELECT name, email FROM users WHERE city = 'New York' AND total_spent > 100;</code></p>
    <h2>Why SQL is a Vital Skill</h2>
    <p>Despite being invented in the 1970s, SQL remains the 3rd most popular programming language. Why? Because almost every business in the world runs on relational databases. Whether you are a marketer analyzing customer data, a product manager tracking feature usage, or an AI researcher cleaning datasets, knowing SQL allows you to extract insights without relying on a software engineer.</p>
    <h2>Popular SQL Dialects</h2>
    <p>While SQL is standardized, different database systems have slight variations in syntax. PostgreSQL is known for robustness and complex queries. MySQL is the standard for web applications. SQLite is a tiny, serverless database used in mobile apps. Learning standard SQL allows you to transition easily between these systems.</p>
  `,
  'NoSQL': `
    <h2>Overview</h2>
    <p>NoSQL ("Not Only SQL") refers to database management systems that do not use the traditional tabular relational database model. They emerged in the late 2000s to handle the massive scale of the internet and the need for flexible data structures.</p>
    <h2>Why NoSQL?</h2>
    <p>Relational databases are hard to scale across multiple servers. If you have a billion users (like Netflix or Instagram), a single SQL database will crash. NoSQL databases are designed for "horizontal scaling"—you can just keep adding cheap servers to handle more load. Additionally, modern apps generate unstructured data (JSON logs, IoT sensor data) that doesn't fit neatly into rigid tables.</p>
    <h2>Types of NoSQL Databases</h2>
    <h3>1. Document Stores</h3>
    <p>Data is stored as JSON-like documents. A user profile with varying fields (some have phone numbers, some don't) is easy to store. <strong>MongoDB</strong> is the most famous example.</p>
    <h3>2. Key-Value Stores</h3>
    <p>The simplest type. Every item is stored as an attribute name (key) with its value. Extremely fast for simple lookups (like caching web pages or storing user sessions). <strong>Redis</strong> is the industry leader here.</p>
    <h3>3. Wide-Column Stores</h3>
    <p>Similar to SQL tables, but columns can vary per row. Designed for massive write speeds. <strong>Cassandra</strong> is used by Apple and Instagram for massive messaging systems.</p>
    <h3>4. Graph Databases</h3>
    <p>Designed specifically for mapping relationships (e.g., social networks where you need to find "friends of friends"). <strong>Neo4j</strong> is the standard.</p>
  `,
  'Linux': `
    <h2>Overview</h2>
    <p>Linux is a free, open-source, Unix-like operating system kernel. Unlike Windows or macOS, Linux is not owned by a single company. It powers the modern internet, running on nearly all of the world's web servers, supercomputers, and Android smartphones.</p>
    <h2>The Open Source Philosophy</h2>
    <p>Created by Linus Torvalds in 1991, Linux is released under the GNU General Public License (GPL). This means anyone can view, modify, and distribute its source code. This led to thousands of "distributions" (distros)—custom versions of Linux bundled with different software.</p>
    <h2>Why Developers and AI Researchers Love Linux</h2>
    <h3>1. The Command Line (Terminal)</h3>
    <p>While Linux has graphical interfaces, its true power is the terminal. Tasks that take dozens of clicks in Windows (like installing software, configuring networks, or searching files) can be done with a single line of code. It allows for deep system automation.</p>
    <h3>2. AI and Server Ecosystem</h3>
    <p>Nearly all AI frameworks (PyTorch, TensorFlow) and cloud servers (AWS, Azure) are optimized for Linux. Docker containers run natively on Linux. If you want to work in AI infrastructure or backend development, Linux proficiency is a mandatory skill.</p>
    <h3>3. Stability and Security</h3>
    <p>Because of its strict user permission system and open-source nature (vulnerabilities are patched rapidly by the community), Linux is highly secure and incredibly stable. A Linux server can run for years without needing a reboot.</p>
    <div class="info-box"><div class="info-box-title">Popular Distros</div><p><strong>Ubuntu:</strong> The most popular for beginners and AI researchers. <strong>Debian:</strong> Ultra-stable, great for servers. <strong>Arch Linux:</strong> For power users who want to build their OS from scratch.</p></div>
  `,
  'Windows': `
    <h2>Overview</h2>
    <p>Microsoft Windows is the dominant desktop operating system globally, holding roughly 70% of the personal computer market share. It is the standard OS for enterprise environments, gaming, and general office work.</p>
    <h2>Strengths of Windows</h2>
    <h3>1. Software Compatibility</h3>
    <p>If a piece of software exists, it runs on Windows. From legacy enterprise accounting software to the latest AAA video games, Windows has the largest software library in the world. Microsoft's backward compatibility ensures 20-year-old apps still run on Windows 11.</p>
    <h3>2. Hardware Freedom</h3>
    <p>Unlike Apple's macOS, Windows can be installed on virtually any combination of hardware. You can build a $300 budget PC or a $5,000 water-cooled behemoth, and Windows will run on it. This allows for massive price competition among hardware manufacturers.</p>
    <h3>3. The Enterprise Standard</h3>
    <p>Active Directory, Microsoft Office, and Outlook are the backbones of corporate IT. If you work a traditional remote job for a large company, you will likely use a Windows machine managed by company IT policies.</p>
    <h2>Windows for Development and AI</h2>
    <p>Historically, Windows was a poor environment for developers compared to Linux. However, Microsoft introduced <strong>WSL (Windows Subsystem for Linux)</strong>, allowing a full Ubuntu terminal to run natively inside Windows. This gives developers the best of both worlds: the software compatibility of Windows and the development tools of Linux.</p>
  `,
  'macOS': `
    <h2>Overview</h2>
    <p>macOS is the operating system exclusively developed by Apple for its Mac computers. Known for its elegant design, intuitive user interface, and seamless integration with the Apple ecosystem, it is the preferred OS for creatives, designers, and a growing number of developers.</p>
    <h2>The Unix Foundation</h2>
    <p>Unlike Windows, macOS is built on a Unix foundation (specifically Darwin). This means it shares the same underlying architecture as Linux. Developers can open the macOS "Terminal" and use the exact same bash commands, SSH into servers, and run Docker containers natively. It is an excellent OS for software engineering without needing dual-boot setups.</p>
    <h2>The Apple Silicon Revolution</h2>
    <p>In 2020, Apple transitioned from Intel processors to their own Apple Silicon chips (M1, M2, M3, M4). This was a paradigm shift. These ARM-based chips provided laptop battery life measured in days, silent operation (no fans on Air models), and performance that rivaled high-end desktops. For remote workers, a MacBook Air became the ultimate travel machine.</p>
    <h2>The Ecosystem Lock-in</h2>
    <p>The main drawback of macOS is its closed nature. You can only run it legally on Apple hardware, which comes with a premium "Apple Tax." Furthermore, Apple's strict control can frustrate power users. However, features like Universal Clipboard (copying on iPhone and pasting on Mac) and AirDrop make the premium worth it for users heavily invested in multiple Apple devices.</p>
  `,
  'Networking': `
    <h2>Overview</h2>
    <p>Computer Networking is the practice of connecting computers and other devices to share resources, exchange files, and communicate. It is the invisible infrastructure that makes the internet, remote work, and cloud computing possible.</p>
    <h2>Key Networking Concepts</h2>
    <h3>1. IP Addresses</h3>
    <p>Every device on a network has a unique IP (Internet Protocol) address, acting like a postal address. IPv4 (e.g., 192.168.1.5) is the standard, but the world is running out of them, leading to the adoption of the much longer IPv6.</p>
    <h3>2. DNS (The Phonebook)</h3>
    <p>Computers communicate using IP addresses, but humans remember names. DNS (Domain Name System) translates human-readable names (like google.com) into IP addresses.</p>
    <h3>3. Routers and Switches</h3>
    <p>A <strong>switch</strong> connects devices within a single local network (e.g., your office computers). A <strong>router</strong> connects your local network to the wider internet, directing traffic and providing basic firewall security.</p>
    <h2>The OSI Model (How Data Travels)</h2>
    <p>Networking is governed by the OSI (Open Systems Interconnection) model, a 7-layer framework. When you send a message, it travels down from the Application Layer (your chat app) through Transport (TCP/UDP) and Network (IP), down to the Physical layer (the ethernet cable), and back up the layers on the receiving end. Understanding this helps network engineers troubleshoot issues (e.g., is the cable broken, or is the DNS server down?).</p>
  `,
  'DNS': `
    <h2>Overview</h2>
    <p>DNS (Domain Name System) is often called the "phonebook of the internet." It is a hierarchical, decentralized naming system that translates human-readable domain names (like harmonia.com) into machine-readable IP addresses (like 104.26.10.78).</p>
    <h2>Why DNS is Necessary</h2>
    <p>Humans access information online through readable domains. Computers access information through IP addresses. Every time you type a URL into a browser, your computer must perform a DNS lookup to find the correct IP address before it can request the webpage. Without DNS, you would have to memorize strings of numbers for every website you visit.</p>
    <h2>How a DNS Lookup Works</h2>
    <ol style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>The Request:</strong> You type "google.com" into your browser. Your computer asks your local ISP's DNS resolver for the IP address.</li>
      <li style="margin-bottom:8px;"><strong>Root Server:</strong> If the resolver doesn't know, it asks a Root server. The root points it to the TLD (Top Level Domain) server for ".com".</li>
      <li style="margin-bottom:8px;"><strong>TLD Server:</strong> The ".com" server points the resolver to the authoritative nameserver for "google.com".</li>
      <li style="margin-bottom:8px;"><strong>Authoritative Server:</strong> This server holds the actual IP address for google.com. It returns the IP to the resolver, which gives it to your browser.</li>
    </ol>
    <div class="info-box"><div class="info-box-title">DNS Propagation</div><p>If you change your website's host, you update the DNS records. This change doesn't happen instantly worldwide. It can take anywhere from a few minutes to 48 hours for all global DNS servers to update their cache. This is known as DNS Propagation.</p></div>
  `,
  'CDN': `
    <h2>Overview</h2>
    <p>A CDN (Content Delivery Network) is a geographically distributed network of servers that work together to provide fast delivery of internet content. If you have ever watched a YouTube video without buffering or loaded a massive webpage instantly, a CDN was responsible.</p>
    <h2>The Problem of Distance</h2>
    <p>If a website's server is in New York, a user in London has to request data across the Atlantic Ocean. Due to the speed of light and router hops, this causes latency (delay). A user in Australia might wait 2-3 seconds for the page to load. Furthermore, if a viral event sends a million users to the New York server at once, the server crashes.</p>
    <h2>How a CDN Solves It</h2>
    <p>A CDN company (like Cloudflare or Akamai) places thousands of "Edge Servers" in data centers all over the world. When a website uses a CDN, all its heavy files (images, videos, CSS) are copied (cached) to these Edge Servers. </p>
    <p>Now, when the Australian user visits the site, they are automatically routed to the Edge Server in Sydney. The data only travels a few miles, loading instantly. The main server in New York is protected from traffic spikes, because 99% of visitors are served from the Edge.</p>
    <h2>Security Benefits</h2>
    <p>Because a CDN sits between the website and the public internet, it acts as a reverse proxy. If a hacker tries to launch a DDoS (Distributed Denial of Service) attack, they hit the massive, highly secured CDN network, not the vulnerable origin server. The CDN absorbs the attack.</p>
  `,
  'Cloudflare': `
    <h2>Overview</h2>
    <p>Cloudflare is one of the most important companies on the modern internet. It is a massive global network that provides CDN services, DDoS mitigation, internet security, and DNS registration. Millions of websites rely on Cloudflare to stay online and secure.</p>
    <h2>The Core Services</h2>
    <h3>1. DNS Management</h3>
    <p>Cloudflare operates one of the fastest and most reliable public DNS resolvers in the world (1.1.1.1). Many domain owners point their nameservers to Cloudflare to manage all their DNS records for free.</p>
    <h3>2. CDN and Caching</h3>
    <p>Cloudflare caches static files at its edge servers. If you update your website, Cloudflare automatically serves the new version, drastically reducing the load on your origin server.</p>
    <h3>3. DDoS Protection</h3>
    <p>Cloudflare's network capacity is larger than almost any DDoS attack. If a botnet tries to take your site offline, Cloudflare's automated systems detect the malicious traffic and block it, while letting legitimate users through.</p>
    <h3>4. The WAF (Web Application Firewall)</h3>
    <p>Cloudflare's WAF inspects incoming traffic for malicious patterns (like SQL injection attempts or cross-site scripting) and blocks hackers before they ever reach your database.</p>
    <div class="info-box"><div class="info-box-title">The "Under Attack" Mode</div><p>If a site is under heavy attack, the admin can enable "Under Attack Mode." This forces every visitor's browser to solve a complex cryptographic puzzle in the background before gaining access. Bots cannot solve this puzzle, keeping the site online for humans.</p></div>
  `,
  'Git': `
    <h2>Overview</h2>
    <p>Git is a distributed version control system (VCS) created by Linus Torvalds (the creator of Linux) in 2005. It tracks changes in computer files and coordinates work among multiple people. It is the absolute standard for software development and increasingly for AI prompt engineering.</p>
    <h2>Why Git is Essential</h2>
    <p>Imagine you are writing a complex report. You might save versions like "report_v1.docx", "report_v2_final.docx", "report_v3_REAL_FINAL.docx". Git eliminates this nightmare. It takes a "snapshot" of your files at specific moments in time. If you make a mistake, you can instantly revert to a previous snapshot.</p>
    <h2>The Core Workflow</h2>
    <ol style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Working Directory:</strong> The actual files you are editing on your computer.</li>
      <li style="margin-bottom:8px;"><strong>Staging Area (git add):</strong> You select which modified files you want to save.</li>
      <li style="margin-bottom:8px;"><strong>Commit (git commit):</strong> You save the snapshot to your local Git repository, along with a message explaining what you changed.</li>
      <li style="margin-bottom:8px;"><strong>Push (git push):</strong> You upload your commits to a remote server (like GitHub).</li>
    </ol>
    <h2>Branching and Merging</h2>
    <p>Git allows "branching." You can create a separate timeline (a branch) to build a new feature. You can experiment wildly on this branch without affecting the main codebase. Once the feature works, you "merge" it back into the main branch.</p>
  `,
  'GitHub': `
    <h2>Overview</h2>
    <p>GitHub is a cloud-based hosting service for Git repositories. While Git is the command-line tool that tracks your code locally, GitHub is the website where you upload that code to share it with the world or collaborate with a team. It is the largest social network for developers.</p>
    <h2>Beyond Hosting</h2>
    <p>While GitHub started as simple Git hosting, it has evolved into a complete software development platform:</p>
    <h3>1. Pull Requests (PRs)</h3>
    <p>The core of collaborative coding. If you want to fix a bug in someone else's project, you "fork" it, make your change, and submit a Pull Request. The project owner reviews your code and can "pull" it into the main project.</p>
    <h3>2. GitHub Actions (CI/CD)</h3>
    <p>Automated workflows. Every time you push code, GitHub can automatically run tests, check for security vulnerabilities, and deploy the app to live servers.</p>
    <h3>3. GitHub Copilot</h3>
    <p>GitHub (owned by Microsoft) integrated OpenAI's models to create Copilot. It reads your code context and writes code for you in real-time, revolutionizing developer productivity.</p>
    <h2>Open Source Hub</h2>
    <p>Almost every major open-source project—Linux, React, TensorFlow, Kubernetes—is hosted on GitHub. It is the central repository of human coding knowledge, which is why AI companies train their models heavily on GitHub data.</p>
    <div class="info-box"><div class="info-box-title">Your GitHub Profile is your Resume</div><p>For developers, a GitHub profile with active, high-quality contributions is far more valuable than a traditional resume. It proves you can write good code and collaborate with others.</p></div>
  `,

  'PayPal': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>PayPal is one of the world's largest and most recognized online payment platforms, operating in over 200 countries. For remote workers and freelancers, it serves as a digital wallet, allowing them to send, receive, and hold funds in multiple currencies.</p></div>
    <h2>How PayPal Works for Freelancers</h2>
    <p>Clients can pay you using your email address linked to your PayPal account. Once received, funds can be held in your PayPal balance, converted to your local currency, or withdrawn to your linked local bank account or debit card.</p>
    <h3>Key Features</h3>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Buyer/Seller Protection:</strong> PayPal offers protection against unauthorized transactions and disputes, though freelance digital services often fall into a gray area.</li>
      <li style="margin-bottom:8px;"><strong>Multi-Currency Holding:</strong> You can hold balances in 25 different currencies.</li>
    </ul>
    <h2>Fee Structure</h2>
    <p>PayPal is notorious for its complex and often high fees. Receiving commercial payments incurs a standard fee (around 2.9% + $0.30). Currency conversion adds a significant markup (usually 3-4% above the mid-market rate).</p>
    <div class="info-box"><div class="info-box-title">Pro Tip</div><p>Always request clients to send payments as "Goods and Services" (which has fees but offers protection) rather than "Friends and Family" (which avoids fees but violates PayPal's terms for business and lacks protection).</p></div>
    <h2>Common Issues</h2>
    <p>PayPal is known for sudden account freezes or "holds." If they detect unusual activity, they may lock your funds for 21 to 180 days. Always withdraw funds immediately to your local bank to minimize risk.</p>

  'Payoneer': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>Payoneer is a financial services company that provides online money transfer and digital payment services specifically designed for freelancers, e-commerce sellers, and businesses. It is the standard payout method for platforms like Upwork, Fiverr, and Appen.</p></div>
    <h2>The Receiving Accounts Feature</h2>
    <p>Payoneer's standout feature is its "Global Payment Service." It provides you with virtual local bank accounts in the US, UK, EU, and Japan. This allows a US client to pay you via a domestic ACH transfer, even if you live in Asia or Africa.</p>
    <h2>Fee Structure</h2>
    <p>Payoneer generally has lower receiving fees than PayPal for cross-border B2B transactions. Receiving money from another Payoneer user is free. Withdrawing funds to your local bank account typically incurs a 2% fee, or a flat $1.50 for USD to a US bank.</p>
    <h3>Annual Fees</h3>

    <div class="info-box"><div class="info-box-title">Best For Large Earnings</div><p>Due to lower percentage fees on larger amounts, Payoneer is highly recommended for freelancers earning over $1,000 per month from freelance marketplaces.</p></div>
    <h2>Payoneer Mastercard</h2>
    <p>Once you receive a certain threshold of payments, you can order a Payoneer debit card. This allows you to spend your balance directly online or at ATMs worldwide, though ATM withdrawal fees are relatively high.</p>

  'Wise': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>Wise (formerly TransferWise) is a London-based financial technology company focused on international money transfers. It is widely considered the cheapest and most transparent way to send and receive money across borders.</p></div>
    <h2>The Mid-Market Rate</h2>
    <p>Unlike PayPal or traditional banks, Wise does not add a hidden markup to the exchange rate. You get the exact mid-market rate you see on Google or Reuters. They make money solely through transparent, upfront fees.</p>
    <h2>Wise Business & Borderless Accounts</h2>
    <p>Freelancers can hold balances in over 50 currencies and convert between them instantly at the real exchange rate. You also get local bank details (US routing, UK sort code, IBANs) similar to Payoneer, allowing clients to pay you locally.</p>
    <h2>Why It Beats PayPal</h2>
    <p>For a $1,000 invoice, PayPal might charge $40 in conversion fees, while Wise might charge $5. The transparency means you know exactly how much the client sent and exactly how much you will receive.</p>
    <div class="info-box"><div class="info-box-title">Debit Card</div><p>The Wise debit card automatically converts your balance to the local currency when you swipe, using the mid-market rate for a tiny fee. It is the ultimate card for digital nomads traveling the world.</p></div>
    <h2>Limitations</h2>
    <p>Wise is an e-money institution, not a bank. It is not designed for direct client invoicing within the platform (like PayPal). Clients usually have to initiate the bank transfer from their own bank account to your Wise account details.</p>

  'GCash': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>GCash is the Philippines' leading mobile wallet and financial super app. For freelancers based in the Philippines, it is an essential tool for receiving international remittances and managing local finances directly from a smartphone.</p></div>
    <h2>Receiving International Payments</h2>
    <p>GCash integrates with global remittance networks like Wise, PayPal, and Western Union. You can link your GCash account to PayPal, allowing you to withdraw your PayPal USD balance directly into GCash as Philippine Pesos (PHP) within minutes, usually with minimal fees.</p>

  'Binance Pay': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>Binance Pay is a borderless, contactless, and fee-free cryptocurrency payment technology designed by Binance, the world's largest crypto exchange. It allows freelancers and remote workers to send and receive crypto payments instantly.</p></div>
    <h2>How It Works</h2>
    <p>Both the sender and receiver must have a verified Binance account. The sender simply scans the receiver's Binance Pay QR code or enters their Pay ID. The crypto (e.g., USDT, BNB, or Bitcoin) is transferred instantly from wallet to wallet.</p>
    <h3>Zero Transaction Fees</h3>
    <p>The biggest advantage of Binance Pay is that it bypasses traditional banking networks and blockchain gas fees. There are absolutely zero network fees for sending or receiving funds via the Binance Pay network.</p>
    <h2>Use Cases for Freelancers</h2>
    <p>For Web3, crypto-native, or international clients, Binance Pay is becoming a preferred payment method. It eliminates the 3% credit card fees or wire transfer delays associated with traditional fiat payouts.</p>
    <div class="info-box"><div class="info-box-title">Currency Stability</div><p>Most freelancers request payment in Stablecoins like USDT or USDC via Binance Pay. This pegs the value to the US Dollar, protecting both parties from the extreme volatility of Bitcoin or Ethereum.</p></div>

  `,
  'USDT': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>USDT (Tether) is the most widely used stablecoin in the cryptocurrency ecosystem. It is pegged 1:1 to the US Dollar, meaning 1 USDT is always roughly equal to $1 USD. For freelancers, it offers the speed and borderless nature of crypto without the price volatility of Bitcoin.</p></div>
    <h2>Why Freelancers Use USDT</h2>
    <p>Traditional bank transfers can take 3-5 days and incur high wire fees. Sending USDT via networks like Tron (TRC20) or Solana takes less than 5 minutes and costs fractions of a cent. It is the ultimate tool for fast, global B2B payments.</p>
    <h2>Networks (Blockchains)</h2>
    <p>USDT exists on multiple blockchains. Choosing the right network is critical:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>TRC20 (Tron):</strong> The most popular for freelancers due to incredibly low gas fees (under $1).</li>

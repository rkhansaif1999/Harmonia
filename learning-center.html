<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmonia Learning Center — Premium Knowledge Base</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    :root {
      --bg: #F8F9FB;
      --surface: #FFFFFF;
      --surface-hover: #F9FAFB;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --accent: #0EA5E9;
      --accent-soft: #E0F2FE;
      --accent-text: #0284C7;
      --success: #10B981;
      --success-soft: #D1FAE5;
      --warning: #F59E0B;
      --warning-soft: #FEF3C7;
      --danger: #EF4444;
      --danger-soft: #FEE2E2;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.06), 0 4px 6px -4px rgba(15, 23, 42, 0.02);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-serif: 'Georgia', 'Times New Roman', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); min-height: 100vh; }

    .app { display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 280px; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto;
      z-index: 50;
    }
    .sidebar-brand { padding: 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .logo-icon { font-size: 24px; }
    .logo-text { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; color: var(--text-primary); }
    .logo-sub { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
    .sidebar-search { padding: 16px; border-bottom: 1px solid var(--border); position: relative; }
    .sidebar-search input {
      width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); font-size: 13px; outline: none; font-family: inherit;
    }
    .sidebar-search input:focus { border-color: var(--accent); }
    .sidebar-search svg { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .sidebar-nav { flex: 1; padding: 8px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; color: var(--text-secondary); transition: all 0.15s; margin-bottom: 2px; }
    .nav-item:hover { background: var(--bg); color: var(--text-primary); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
    .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .nav-item .nav-arrow { margin-left: auto; font-size: 11px; transition: transform 0.2s; }
    .nav-item.expanded .nav-arrow { transform: rotate(90deg); }
    .nav-children { margin-left: 8px; padding-left: 16px; border-left: 1px solid var(--border); display: none; }
    .nav-children.show { display: block; }
    .nav-child { display: block; padding: 6px 12px; font-size: 12px; color: var(--text-muted); border-radius: var(--radius-sm); cursor: pointer; margin: 2px 0; }
    .nav-child:hover { color: var(--text-primary); background: var(--bg); }
    .nav-child.active { color: var(--accent-text); font-weight: 500; background: var(--accent-soft); }
    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); text-align: center; }

    /* MAIN */
    .main { margin-left: 280px; flex: 1; min-height: 100vh; }
    .topbar {
      height: 64px; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
    }
    .breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
    .breadcrumbs span { cursor: pointer; }
    .breadcrumbs span:hover { color: var(--text-primary); }
    .breadcrumbs .sep { color: var(--border-strong); }
    .topbar-actions { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-family: inherit;
      cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--border-strong); background: var(--bg); }
    .btn-primary { background: var(--text-primary); color: white; border-color: var(--text-primary); }
    .btn-primary:hover { background: #1e293b; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-ghost { border-color: transparent; background: transparent; }

    /* CONTENT */
    .content { padding: 32px; max-width: 900px; }

    /* HOME */
    .hero { text-align: center; padding: 48px 0 32px; }
    .hero h1 { font-size: 40px; font-weight: 600; letter-spacing: -0.8px; line-height: 1.15; margin-bottom: 12px; }
    .hero p { font-size: 17px; color: var(--text-secondary); max-width: 560px; margin: 0 auto 28px; line-height: 1.6; }
    .hero-search { max-width: 560px; margin: 0 auto; position: relative; }
    .hero-search input {
      width: 100%; padding: 14px 16px 14px 44px; border: 1px solid var(--border-strong); border-radius: var(--radius);
      background: var(--surface); font-size: 15px; outline: none; box-shadow: var(--shadow);
    }
    .hero-search input:focus { border-color: var(--accent); }
    .hero-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .hero-stats { display: flex; justify-content: center; gap: 40px; margin-top: 28px; }
    .stat { text-align: center; }
    .stat-value { font-size: 22px; font-weight: 600; color: var(--text-primary); }
    .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }

    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); font-weight: 600; margin: 40px 0 16px; }
    .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .cat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px;
      cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
    }
    .cat-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: var(--border-strong); }
    .cat-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .cat-card-icon { font-size: 22px; }
    .cat-card-title { font-size: 15px; font-weight: 600; }
    .cat-card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 12px; }
    .cat-card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); }
    .tag.accent { background: var(--accent-soft); color: var(--accent-text); border-color: #bae6fd; }

    .featured { display: grid; grid-template-columns: 1fr 320px; gap: 16px; margin-top: 32px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); }
    .panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 600; margin-bottom: 14px; }
    .article-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .article-row:last-child { border-bottom: none; padding-bottom: 0; }
    .article-row:hover .art-title { color: var(--accent-text); }
    .art-num { font-size: 12px; font-weight: 600; color: var(--text-muted); min-width: 20px; margin-top: 2px; }
    .art-title { font-size: 14px; font-weight: 500; line-height: 1.4; margin-bottom: 4px; transition: color 0.15s; }
    .art-meta { font-size: 12px; color: var(--text-muted); }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; margin-left: 6px; }
    .badge-hot { background: var(--danger-soft); color: var(--danger); }
    .badge-new { background: var(--success-soft); color: var(--success); }
    .badge-updated { background: var(--warning-soft); color: #92400e; }

    .quote { font-family: var(--font-serif); font-style: italic; font-size: 15px; line-height: 1.7; color: var(--text-secondary); border-left: 3px solid var(--accent); padding-left: 16px; margin: 12px 0; }
    .author { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
    .author-info h4 { font-size: 13px; font-weight: 600; }
    .author-info span { font-size: 12px; color: var(--text-muted); }

    /* CATEGORY VIEW */
    .cat-hero { padding: 24px; background: linear-gradient(135deg, var(--surface) 0%, var(--bg) 100%); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 24px; }
    .cat-hero-header { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .cat-hero-icon { font-size: 36px; }
    .cat-hero h2 { font-size: 28px; font-weight: 600; letter-spacing: -0.3px; }
    .cat-hero p { color: var(--text-secondary); font-size: 15px; max-width: 600px; line-height: 1.6; }
    .cat-hero-stats { display: flex; gap: 24px; margin-top: 16px; }
    .cat-hero-stat { font-size: 13px; color: var(--text-muted); }
    .cat-hero-stat strong { color: var(--text-primary); font-weight: 600; }

    .section-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .section-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .section-card h3 span { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .article-list { display: flex; flex-direction: column; gap: 6px; }
    .article-link { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
    .article-link:hover { background: var(--bg); color: var(--text-primary); }
    .article-link::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; }
    .article-link:hover::before { background: var(--accent); }

    .platform-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .platform-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .platform-card:hover { box-shadow: var(--shadow); border-color: var(--border-strong); transform: translateY(-1px); }
    .platform-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .platform-card span { font-size: 11px; color: var(--text-muted); }

    /* ARTICLE VIEW */
    .article-header { margin-bottom: 32px; }
    .article-badges { display: flex; gap: 8px; margin-bottom: 12px; }
    .article-badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); }
    .article-title { font-size: 36px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 16px; }
    .article-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }
    .article-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); }

    .article-layout { display: grid; grid-template-columns: 1fr 240px; gap: 32px; }
    .article-body { font-size: 15px; line-height: 1.8; color: var(--text-secondary); }
    .article-body h2 { font-size: 22px; font-weight: 600; color: var(--text-primary); margin: 32px 0 16px; letter-spacing: -0.3px; }
    .article-body h3 { font-size: 17px; font-weight: 600; color: var(--text-primary); margin: 24px 0 12px; }
    .article-body p { margin-bottom: 16px; }
    .placeholder-text { background: linear-gradient(90deg, var(--bg) 0%, #f1f5f9 50%, var(--bg) 100%); background-size: 200% 100%; animation: shimmer 2s infinite; border-radius: 4px; height: 16px; margin-bottom: 12px; }
    .placeholder-text.short { width: 60%; }
    .placeholder-text.medium { width: 85%; }
    .placeholder-text.long { width: 100%; }
    .placeholder-block { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin: 20px 0; }
    .placeholder-block-title { width: 40%; height: 16px; background: var(--border); border-radius: 4px; margin-bottom: 12px; }
    .placeholder-block-line { height: 12px; background: var(--border); border-radius: 4px; margin-bottom: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .toc { position: sticky; top: 88px; }
    .toc-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 600; margin-bottom: 12px; }
    .toc-list { display: flex; flex-direction: column; gap: 4px; }
    .toc-item { font-size: 12px; color: var(--text-muted); padding: 4px 0; cursor: pointer; border-left: 2px solid transparent; padding-left: 10px; }
    .toc-item:hover { color: var(--text-primary); border-left-color: var(--border); }
    .toc-item.active { color: var(--accent-text); border-left-color: var(--accent); font-weight: 500; }

    .info-box { background: var(--accent-soft); border: 1px solid #bae6fd; border-radius: var(--radius); padding: 16px; margin: 20px 0; }
    .info-box-title { font-size: 13px; font-weight: 600; color: var(--accent-text); margin-bottom: 6px; }
    .info-box p { font-size: 13px; color: var(--accent-text); margin: 0; opacity: 0.8; }

    .related-section { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); }
    .related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .related-card { padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.15s; }
    .related-card:hover { border-color: var(--accent); background: var(--accent-soft); }
    .related-card h4 { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .related-card span { font-size: 11px; color: var(--text-muted); }

    .feedback-bar { margin-top: 40px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: space-between; }
    .feedback-bar p { font-size: 13px; color: var(--text-secondary); }
    .feedback-actions { display: flex; gap: 8px; }

    /* COURSE / GLOSSARY / COMPANY CARDS */
    .card-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .std-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all 0.2s; }
    .std-card:hover { box-shadow: var(--shadow); border-color: var(--border-strong); }
    .std-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .std-card p { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    .std-card .meta { margin-top: 10px; font-size: 11px; color: var(--text-muted); display: flex; gap: 8px; }
    .progress-bar { height: 4px; background: var(--bg); border-radius: 2px; margin-top: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }

    @media (max-width: 1024px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; }
      .featured, .article-layout, .section-grid, .cat-grid { grid-template-columns: 1fr; }
      .platform-grid, .card-grid-3, .card-grid-4, .related-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

let currentView = 'home';
let currentCategory = null;
let currentArticle = null;

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  Object.entries(data).forEach(([key, cat]) => {
    const item = document.createElement('div');
    item.className = 'nav-item' + (currentCategory === key ? ' active' : '');
    item.innerHTML = `<span class="nav-icon">${cat.icon}</span><span>${cat.title}</span><span class="nav-arrow">▸</span>`;
    item.onclick = () => { toggleNav(key); showCategory(key); };
    nav.appendChild(item);

    const children = document.createElement('div');
    children.className = 'nav-children' + (currentCategory === key ? ' show' : '');
    children.id = 'nav-' + key;
    if (cat.sections) {
      cat.sections.forEach(sec => {
        const child = document.createElement('span');
        child.className = 'nav-child';
        child.textContent = sec.title;
        child.onclick = (e) => { e.stopPropagation(); showCategory(key); };
        children.appendChild(child);
      });
    }
    if (cat.items) {
      cat.items.slice(0, 5).forEach(it => {
        const child = document.createElement('span');
        child.className = 'nav-child';
        child.textContent = it.name || it.term;
        child.onclick = (e) => { e.stopPropagation(); showArticle(key, it.name || it.term); };
        children.appendChild(child);
      });
      if (cat.items.length > 5) {
        const more = document.createElement('span');
        more.className = 'nav-child';
        more.style.fontStyle = 'italic';
        more.textContent = `+${cat.items.length - 5} more...`;
        more.onclick = (e) => { e.stopPropagation(); showCategory(key); };
        children.appendChild(more);
      }
    }
    nav.appendChild(children);
  });
}

function toggleNav(key) {
  const el = document.getElementById('nav-' + key);
  if (el) el.classList.toggle('show');
}

function updateBreadcrumbs(path) {
  const bc = document.getElementById('breadcrumbs');
  let html = `<span onclick="goHome()">Home</span>`;
  path.forEach((p, i) => {
    html += ` <span class="sep">/</span> `;
    if (i === path.length - 1) html += `<span style="color:var(--text-primary);font-weight:500">${p.label}</span>`;
    else html += `<span onclick="${p.action}">${p.label}</span>`;
  });
  bc.innerHTML = html;
}

function goHome() {
  currentView = 'home'; currentCategory = null; currentArticle = null;
  renderSidebar(); renderHome();
}

function showCategory(key) {
  currentView = 'category'; currentCategory = key; currentArticle = null;
  renderSidebar();

  'History of AI': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>The history of Artificial Intelligence spans from ancient myths of mechanical men to the sophisticated machine learning algorithms that power our modern world. This guide covers the key milestones.</p></div>
    <h2>The Early Foundations (1940s-1950s)</h2>
    <p>The formal birth of AI as an academic discipline occurred in 1956 at the Dartmouth Conference, where the term "Artificial Intelligence" was coined by John McCarthy. Early pioneers like Alan Turing laid the groundwork with the Turing Test, proposing that a machine could be considered intelligent if it could converse with a human without being distinguished from a human.</p>
    <h3>Key Early Milestones</h3>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>1950:</strong> Alan Turing publishes "Computing Machinery and Intelligence".</li>
      <li style="margin-bottom:8px;"><strong>1956:</strong> The Dartmouth Summer Research Project marks the official birth of AI.</li>
      <li style="margin-bottom:8px;"><strong>1959:</strong> Arthur Samuel coins the term "Machine Learning".</li>
    </ul>
    <h2>The AI Winters (1970s-1990s)</h2>
    <p>Following early optimism, progress stalled due to hardware limitations and unrealistic expectations. This led to periods of reduced funding and interest known as "AI Winters." Expert systems briefly revived interest in the 1980s, but true resurgence required greater computational power.</p>
    <h2>The Deep Learning Revolution (2010s-Present)</h2>
    <p>The explosion of big data, combined with powerful GPUs, allowed neural networks to finally fulfill their potential. Breakthroughs in deep learning enabled unprecedented advances in image recognition, natural language processing, and generative AI.</p>
    <div class="info-box"><div class="info-box-title">Key Takeaway</div><p>Modern AI is built on decades of theoretical research, but only recently became practical due to advancements in hardware (GPUs) and data availability.</p></div>
  `,
  'Types of AI': `
    <h2>Overview</h2>
    <p>Artificial Intelligence can be classified in two primary ways: based on its <strong>capability</strong> (how smart it is) and based on its <strong>functionality</strong> (how it processes information and thinks).</p>
    <h2>Classification Based on Capability</h2>
    <h3>1. Narrow AI (ANI)</h3>
    <p>Also known as Weak AI, this is the only type of AI that exists today. It is designed to perform a single specific task extremely well, such as playing chess, facial recognition, or driving a car. While it may seem incredibly smart, it operates within a strict, predefined domain.</p>
    <h3>2. General AI (AGI)</h3>
    <p>Artificial General Intelligence refers to a machine that possesses human-level intelligence, capable of learning, reasoning, and solving problems across any cognitive task that a human can. AGI remains theoretical and is the subject of ongoing research.</p>
    <h3>3. Super AI (ASI)</h3>
    <p>Artificial Super Intelligence is a hypothetical concept where machines surpass human intelligence across all fields, including creativity, general wisdom, and problem-solving. It raises significant ethical and existential questions.</p>
    <div class="info-box"><div class="info-box-title">Current Reality</div><p>Despite the incredible capabilities of tools like ChatGPT or Midjourney, they are all strictly forms of Narrow AI. They simulate general intelligence but are ultimately predicting patterns in data.</p></div>
    <h2>Classification Based on Functionality</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Reactive Machines:</strong> Do not store memories or past experiences (e.g., IBM's Deep Blue chess computer).</li>
      <li style="margin-bottom:8px;"><strong>Limited Memory:</strong> Can retain some historical data to make better decisions (e.g., autonomous vehicles observing speed and direction of nearby cars).</li>
      <li style="margin-bottom:8px;"><strong>Theory of Mind:</strong> (Conceptual) AI that can understand emotions, beliefs, and thoughts of humans interacting with it.</li>
      <li style="margin-bottom:8px;"><strong>Self-Aware:</strong> (Conceptual) AI that has its own consciousness and self-awareness.</li>
    </ul>
  `,
  'Narrow AI': `
    <h2>Overview</h2>
    <p>Narrow AI, or Artificial Narrow Intelligence (ANI), is the only form of AI that currently exists. It is engineered to perform one specific task—often better than a human—but cannot transfer its learning to a different domain.</p>
    <h2>Characteristics of Narrow AI</h2>
    <p>Unlike human intelligence, which is generalized, Narrow AI operates within a pre-defined set of parameters, constraints, and contexts. It does not possess consciousness, self-awareness, or true understanding. When an AI like Deep Blue beats a grandmaster at chess, it cannot then turn around and play a simple game of tic-tac-toe without being completely reprogrammed.</p>
    <h2>Real-World Examples</h2>
    <h3>Virtual Assistants</h3>
    <p>Siri, Alexa, and Google Assistant are prime examples of Narrow AI. They use speech recognition to understand commands and fetch information, but they don't actually "understand" the meaning behind your words in a human sense.</p>
    <h3>Recommendation Engines</h3>
    <p>Netflix and Amazon algorithms analyze your past behavior to suggest products or shows. They are highly optimized for this single task of pattern matching but cannot drive a car or write an essay.</p>
    <h3>Spam Filters</h3>
    <p>Email providers use Narrow AI to classify incoming messages as spam or not-spam based on specific keywords and sender reputations.</p>
    <div class="info-box"><div class="info-box-title">The Illusion of Intelligence</div><p>Large Language Models like ChatGPT are also technically Narrow AI, despite their conversational flexibility. They are narrow because their sole function is predicting the next word in a sequence based on statistical probabilities.</p></div>
  `,
  'General AI': `
    <h2>Overview</h2>
    <p>Artificial General Intelligence (AGI) represents a machine's ability to understand, learn, and apply knowledge across a wide range of tasks at a level comparable to human intelligence. It is the holy grail of AI research.</p>
    <h2>What AGI Would Look Like</h2>
    <p>If an AGI were created, it would not need to be explicitly programmed for every scenario. You could teach it how to play chess, and it could use that underlying logic to learn how to play checkers, strategize in a video game, or even solve logistical problems in supply chain management. It would possess common sense, reasoning, and the ability to transfer learning from one domain to another.</p>
    <h2>Current Status</h2>
    <p>AGI does not exist yet. While modern LLMs show sparks of generalization (e.g., writing code, translating languages, and writing poetry all within one model), they still lack true reasoning, memory continuity, and the ability to autonomously interact with the physical world.</p>
    <h2>Major Hurdles to Achieving AGI</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Common Sense Reasoning:</strong> Humans instinctively know that dropping a glass on a hard floor will break it. AI struggles with this implicit, unwritten knowledge of the world.</li>
      <li style="margin-bottom:8px;"><strong>Context Switching:</strong> An AGI must be able to seamlessly switch between different contexts and tasks without forgetting previous ones.</li>
      <li style="margin-bottom:8px;"><strong>Hardware Limitations:</strong> The human brain operates on roughly 20 watts of power. Current AI requires massive data centers consuming megawatts.</li>

  `,
  'Super AI': `
    <h2>Overview</h2>
    <p>Artificial Super Intelligence (ASI) is a theoretical stage where machine intellect surpasses human intelligence across every domain—creativity, general wisdom, problem-solving, and social skills. It is the logical (and terrifying) endpoint of the "intelligence explosion."</p>
    <h2>The Concept of the Singularity</h2>
    <p>The Singularity is a hypothetical future point in time when technological growth becomes uncontrollable and irreversible, resulting in unfathomable changes to human civilization. The idea is that once we create AGI, that AGI will immediately begin working to improve its own code, creating a smarter ASI, which then improves itself even faster, leading to an exponential explosion of intelligence.</p>
    <h2>Capabilities of ASI</h2>
    <p>An ASI would possess cognitive abilities that are incomprehensible to humans. It could:</p>

      <li style="margin-bottom:8px;">Predict global economic and social patterns with perfect accuracy.</li>
      <li style="margin-bottom:8px;">Develop technologies that humans cannot currently conceptualize.</li>
    </ul>
    <h2>The Alignment Problem</h2>
    <p>The primary concern with ASI is alignment: ensuring that the goals of a superintelligent machine are aligned with human survival and flourishing. If an ASI's goals diverge from ours even slightly, it could view humans as an obstacle or a waste of resources.</p>
    <div class="info-box"><div class="info-box-title">Important Distinction</div><p>ASI is entirely theoretical and heavily debated. Some scientists believe it is impossible, while others view it as an inevitable existential threat to humanity.</p></div>
  `,
  'Machine Learning': `
    <h2>Overview</h2>
    <p>Machine Learning (ML) is a subfield of Artificial Intelligence that focuses on the development of algorithms and statistical models that enable computer systems to learn from and make predictions on data, without being explicitly programmed.</p>
    <h2>How Machine Learning Works</h2>
    <p>Instead of writing code that dictates every step a computer should take, an ML engineer feeds data into an algorithm. The algorithm identifies patterns in the data and builds a model that can make predictions or decisions when exposed to new, unseen data.</p>
    <h2>Types of Machine Learning</h2>
    <h3>Supervised Learning</h3>
    <p>The model is trained on a labeled dataset, meaning the input data comes with the correct output. The model learns by comparing its actual output with the correct outputs to find errors. It then modifies the model accordingly. Example: Predicting house prices based on historical data.</p>
    <h3>Unsupervised Learning</h3>
    <p>The model is given unlabeled data and must find structure and patterns on its own. This is commonly used for clustering, anomaly detection, and association. Example: Grouping customers by purchasing behavior.</p>
    <h3>Reinforcement Learning</h3>
    <p>The model learns by interacting with an environment. It receives rewards for correct actions and punishments for incorrect ones, essentially learning through trial and error. This is the technology behind advanced game-playing AIs like AlphaGo.</p>
    <div class="info-box"><div class="info-box-title">Practical Application</div><p>Machine learning is the engine behind recommendation systems (Netflix, Amazon), fraud detection in banking, and predictive text on your smartphone.</p></div>
  `,
  'Deep Learning': `
    <h2>Overview</h2>
    <p>Deep Learning is a specialized subset of Machine Learning inspired by the structure and function of the human brain, known as artificial neural networks. The "deep" in deep learning refers to the multiple layers (hidden layers) through which data is processed.</p>
    <h2>Neural Networks Explained</h2>
    <p>An artificial neural network consists of interconnected nodes (neurons) organized in layers:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Input Layer:</strong> Takes in the raw data.</li>
      <li style="margin-bottom:8px;"><strong>Hidden Layers:</strong> Perform complex mathematical transformations to extract features and patterns. The more hidden layers, the "deeper" the network.</li>
      <li style="margin-bottom:8px;"><strong>Output Layer:</strong> Delivers the final prediction or classification.</li>
    </ul>
    <h2>Why Deep Learning Matters Now</h2>
    <p>While neural networks were theorized in the mid-20th century, they required massive amounts of data and computational power to be effective. The advent of Big Data and modern GPUs in the 2010s allowed deep learning to outperform traditional ML in tasks involving unstructured data like images, audio, and text.</p>
    <h2>Common Deep Learning Architectures</h2>
    <h3>Convolutional Neural Networks (CNNs)</h3>
    <p>Primarily used for image processing and computer vision. They use a mathematical operation called convolution in at least one of their layers, allowing them to detect edges, shapes, and eventually complex objects within an image.</p>
    <h3>Recurrent Neural Networks (RNNs)</h3>
    <p>Designed for sequential data like time series, speech, or text. They have "memory" which allows information to persist, making them ideal for language translation and speech recognition.</p>
    <h3>Transformers</h3>
    <p>The architecture behind modern Large Language Models (LLMs) like GPT. Transformers use a mechanism called "attention" to weigh the importance of different words in a sequence, enabling them to understand context brilliantly.</p>
  `,
  'Neural Networks': `
    <h2>Overview</h2>
    <p>Neural Networks are the foundational architecture of deep learning. Modeled loosely after the human brain, they consist of layers of artificial neurons (nodes) that pass signals to one another to process complex data.</p>
    <h2>Anatomy of a Neuron</h2>
    <p>An artificial neuron receives one or more inputs. Each input has a "weight" assigned to it, which determines its importance. The neuron sums all the weighted inputs, adds a "bias," and then passes the result through an "activation function" to determine its final output.</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Weights:</strong> Adjust during training to strengthen or weaken connections.</li>
      <li style="margin-bottom:8px;"><strong>Bias:</strong> Shifts the activation function to better fit the data.</li>
      <li style="margin-bottom:8px;"><strong>Activation Function:</strong> Decides whether the neuron should "fire" (e.g., ReLU, Sigmoid).</li>
    </ul>
    <h2>How They Learn: Backpropagation</h2>
    <p>Neural networks learn through a process called backpropagation. When the network makes a prediction, it calculates how far off it was from the correct answer (the "loss"). It then works backward through the network, adjusting the weights and biases slightly to reduce that error next time. Over millions of iterations, the network becomes highly accurate.</p>
    <div class="info-box"><div class="info-box-title">The "Black Box" Problem</div><p>Because neural networks can have billions of interconnected weights, it is often impossible for humans to trace exactly *why* the network made a specific decision. This lack of transparency is a major challenge in AI ethics and safety.</p></div>
  `,
  'Computer Vision': `
    <h2>Overview</h2>
    <p>Computer Vision (CV) is a field of Artificial Intelligence that trains computers to interpret and understand the visual world. By using digital images from cameras and videos, machines can accurately identify and classify objects, and then react to what they "see."</p>
    <h2>How Computers "See"</h2>
    <p>Computers do not see images the way humans do. To a computer, an image is simply a grid of numbers representing pixel colors. Computer vision algorithms use these grids to find patterns, edges, and textures.</p>
    <h3>Convolutional Neural Networks (CNNs)</h3>
    <p>CNNs are the gold standard for computer vision. They use filters that slide over the image to detect low-level features (like horizontal edges) in the early layers, and combine them into high-level features (like a face or a car) in the deeper layers.</p>
    <h2>Key Tasks in Computer Vision</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Image Classification:</strong> Assigning a single label to an entire image (e.g., "Dog" or "Cat").</li>
      <li style="margin-bottom:8px;"><strong>Object Detection:</strong> Identifying multiple objects in an image and drawing bounding boxes around them.</li>
      <li style="margin-bottom:8px;"><strong>Semantic Segmentation:</strong> Classifying every single pixel in an image to a specific category.</li>
    </ul>
    <div class="info-box"><div class="info-box-title">Real-World Impact</div><p>Computer vision is the technology powering self-driving cars (identifying pedestrians and stop signs), facial recognition on smartphones, and medical imaging (detecting tumors in X-rays).</p></div>
  `,
  'Natural Language Processing': `
    <h2>Overview</h2>
    <p>Natural Language Processing (NLP) is a branch of artificial intelligence that helps computers understand, interpret, and manipulate human language. It bridges the gap between human communication and computer understanding.</p>
    <h2>The Two Core Components</h2>
    <h3>1. Natural Language Understanding (NLU)</h3>
    <p>NLU allows computers to derive meaning from human language. It handles ambiguity, context, and intent recognition. For example, understanding that "It's raining cats and dogs" does not mean animals are falling from the sky.</p>
    <h3>2. Natural Language Generation (NLG)</h3>
    <p>NLG takes structured data and turns it into human-readable text. This is what allows AI to write essays, summarize articles, or generate conversational responses.</p>
    <h2>Evolution of NLP</h2>
    <p>Early NLP relied on rigid, rule-based systems (grammar and syntax rules). Today, NLP is dominated by Large Language Models based on the Transformer architecture. Instead of being given rules, these models learn the statistical relationships between billions of words.</p>
    <div class="info-box"><div class="info-box-title">Everyday NLP</div><p>You use NLP daily without realizing it. Spellcheck, email spam filters, Google Translate, and voice assistants like Siri all rely heavily on Natural Language Processing.</p></div>
  `,
  'Robotics': `
    <h2>Overview</h2>
    <p>Robotics is an interdisciplinary branch of engineering and computer science that involves the design, construction, operation, and use of robots. When combined with AI, robots move from being simple, repetitive machines to autonomous agents capable of navigating and interacting with the physical world.</p>
    <h2>AI vs. Traditional Robotics</h2>
    <p>Traditional robots are programmed to perform exact, repetitive tasks in controlled environments (like welding parts on a car assembly line). They do not "think." AI-infused robots use sensors (cameras, LiDAR) to perceive their environment, and machine learning algorithms to adapt to changes in real-time.</p>
    <h2>Key Components of an AI Robot</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Perception:</strong> Computer vision and sensors to map the surroundings.</li>
      <li style="margin-bottom:8px;"><strong>Cognition:</strong> AI algorithms to process sensor data and make decisions.</li>
      <li style="margin-bottom:8px;"><strong>Action:</strong> Actuators, motors, and grippers to execute physical movements.</li>
    </ul>
    <h2>Challenges in AI Robotics</h2>
    <p>The physical world is messy. Unlike an AI playing chess, a robot must deal with friction, gravity, battery life, and unpredictable human behavior. The "Sim-to-Real" gap (transferring an AI trained in a simulation to a physical robot) is a major ongoing challenge in the field.</p>
  `,
  'AI Agents': `
    <h2>Overview</h2>
    <p>An AI Agent is an autonomous entity that perceives its environment, makes decisions, and takes actions to achieve a specific goal. Unlike a standard chatbot that just answers questions, an agent actively interacts with software or the physical world.</p>
    <h2>How AI Agents Work</h2>
    <p>Agents operate on a continuous loop: Perceive, Think, Act. They use sensors (or data inputs) to assess the current state, consult their internal logic or AI model to decide the best course of action, and then execute that action using tools or APIs.</p>
    <h3>The Role of "Tools"</h3>
    <p>What makes modern AI agents powerful is their ability to use external tools. An agent might be given access to a web browser, a calculator, and a calendar. If you ask it "When is the next SpaceX launch?", it can use the browser to search the web, use the calculator to determine how many days away that is, and use the calendar to set a reminder.</p>
    <div class="info-box"><div class="info-box-title">Everyday Examples</div><p>A smart thermostat is a simple AI agent. It perceives the room temperature, checks the user's schedule, and acts by turning on the heater to reach the desired temperature before you arrive home.</p></div>
  `,
  'Agentic AI': `
    <h2>Overview</h2>
    <p>While an AI Agent might perform a single automated task, "Agentic AI" refers to highly advanced systems capable of complex, multi-step reasoning and autonomous goal pursuit over long periods. It represents the cutting edge of current AI research.</p>
    <h2>Agentic vs. Generative AI</h2>
    <p>Generative AI (like standard ChatGPT) requires human prompting for every step. You ask a question, it answers. Agentic AI shifts the paradigm: you give it a high-level goal (e.g., "Research the top 5 competitors to my business and draft an email summarizing their strengths"), and the AI autonomously breaks the goal down into sub-tasks, executes them, corrects its own errors, and delivers the final product.</p>
    <h2>Core Capabilities of Agentic AI</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Planning:</strong> Breaking a large goal into a step-by-step execution plan.</li>
      <li style="margin-bottom:8px;"><strong>Memory:</strong> Maintaining context over long periods and remembering past attempts.</li>
      <li style="margin-bottom:8px;"><strong>Tool Use:</strong> Writing and executing code, querying databases, or controlling web browsers.</li>
      <li style="margin-bottom:8px;"><strong>Self-Reflection:</strong> Reviewing its own output, realizing it made a mistake, and trying a different approach.</li>
    </ul>
    <div class="info-box"><div class="info-box-title">The Future of Work</div><p>Agentic AI promises to transform knowledge work. Instead of humans doing the work with AI assistance, humans will act as managers, overseeing teams of Agentic AI workers that execute the heavy lifting.</p></div>
  `,
  'Multimodal AI': `
    <h2>Overview</h2>
    <p>Multimodal AI refers to artificial intelligence systems capable of understanding, processing, and generating content across multiple types of data simultaneously—such as text, images, audio, and video. This mirrors how humans perceive the world using multiple senses at once.</p>
    <h2>Beyond Text-Only AI</h2>
    <p>Earlier AI models were siloed. You had a model for text (LLMs), a separate model for images (like early CNNs), and another for audio. Multimodal AI combines these modalities into a single, unified model, allowing it to understand the relationships between different types of data.</p>
    <h2>How Multimodality Works</h2>
    <p>The AI converts different data types into a common mathematical format (embeddings). Whether it's the word "dog," a picture of a dog, or the sound of a bark, the AI maps them all to the same conceptual space. This allows the model to seamlessly transition between text and images.</p>
    <h2>Practical Applications</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Image Generation:</strong> Models like Midjourney or DALL-E take text prompts and generate corresponding images.</li>
      <li style="margin-bottom:8px;"><strong>Visual Question Answering:</strong> You can upload a photo of a broken machine and ask the AI, "What part is broken and how do I fix it?"</li>
      <li style="margin-bottom:8px;"><strong>Accessibility:</strong> Real-time audio description of video feeds for the visually impaired.</li>
    </ul>
    <div class="info-box"><div class="info-box-title">Industry Standard</div><p>Almost all cutting-edge models released today (like GPT-4o and Google Gemini) are natively multimodal. Text-only AI is rapidly becoming obsolete.</p></div>
  `,
  'AI Safety': `
    <h2>Overview</h2>
    <p>AI Safety is a subfield of AI research focused on ensuring that artificial intelligence systems function as intended without causing harm. It addresses both near-term risks (like biased algorithms) and long-term, existential risks associated with AGI.</p>
    <h2>The Alignment Problem</h2>
    <p>The core challenge of AI safety is alignment: ensuring that an AI's goals align with human values. If an AI is instructed to "make humans happy," it might decide to wirehead humans (stimulating the pleasure centers of the brain) rather than fostering a healthy society. Defining and instilling human values into mathematical systems is extraordinarily difficult.</p>
    <h2>Key Safety Concerns</h2>
    <h3>Robustness</h3>
    <p>AI systems must be resilient to unexpected inputs or attacks. "Adversarial attacks" involve making tiny, invisible changes to an image that cause an AI to completely misclassify it (e.g., mistaking a stop sign for a speed limit sign).</p>
    <h3>Unintended Consequences</h3>
    <p>AIs are highly literal. If a reward function is poorly specified, the AI will find loopholes to maximize its reward in ways the creators never intended (a phenomenon known as "reward hacking").</p>
    <div class="info-box"><div class="info-box-title">Importance of Red Teaming</div><p>AI companies now employ "Red Teams"—groups of researchers whose sole job is to try and break the AI, trick it into doing something dangerous, or expose its biases before it is released to the public.</p></div>
  `,
  'AI Ethics': `
    <h2>Overview</h2>
    <p>AI Ethics is the study of moral principles and guidelines that govern the responsible development, deployment, and use of artificial intelligence. As AI systems increasingly impact human lives, ensuring they are fair, transparent, and safe is paramount.</p>
    <h2>The Core Pillars of AI Ethics</h2>
    <h3>1. Bias and Fairness</h3>
    <p>AI models learn from historical data, which often contains human biases. If not carefully audited, AI systems can perpetuate or even amplify discrimination in areas like hiring, lending, and law enforcement. Ensuring fairness requires diverse training datasets and continuous algorithmic auditing.</p>
    <h3>2. Transparency and Explainability</h3>
    <p>Many advanced AI models, particularly deep neural networks, operate as "black boxes"—meaning even their creators cannot fully explain how they arrived at a specific decision. Ethical AI requires explainability, allowing humans to understand the logic behind an AI's output, especially in critical fields like medicine.</p>
    <h3>3. Privacy and Data Rights</h3>
    <p>Training massive AI models requires vast amounts of data, much of which is scraped from the internet. This raises serious questions about consent, data ownership, and the potential for AI to inadvertently expose personal information.</p>
    <h3>4. Accountability</h3>
    <p>When an AI system makes a mistake—such as a self-driving car causing an accident or a medical AI misdiagnosing a patient—who is responsible? Establishing clear chains of accountability among developers, companies, and users is a major ongoing legal and ethical challenge.</p>
    <div class="info-box"><div class="info-box-title">Real-World Example</div><p>In 2018, Amazon had to scrap an AI recruiting tool because it showed bias against women. The model was trained on resumes submitted over a 10-year period, which were predominantly from men, causing the AI to penalize resumes that included the word "women's."</p></div>
  `,
  'AI Governance': `
    <h2>Overview</h2>
    <p>AI Governance refers to the internal frameworks, policies, and oversight mechanisms that organizations put in place to manage the risks and ensure the responsible use of Artificial Intelligence. It is the corporate equivalent of AI Regulation.</p>
    <h2>Why AI Governance Matters</h2>
    <p>Without proper governance, companies risk deploying AI that violates privacy laws, discriminates against customers, or hallucinates damaging misinformation. Strong governance builds trust with users and protects the company from legal liability.</p>
    <h2>Pillars of Corporate AI Governance</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>AI Ethics Boards:</strong> Cross-functional teams that review and approve high-risk AI projects before launch.</li>
      <li style="margin-bottom:8px;"><strong>Model Cards:</strong> Documentation that explains what an AI model does, what data it was trained on, its limitations, and its known biases.</li>
      <li style="margin-bottom:8px;"><strong>Audit Trails:</strong> Logging systems that record exactly how an AI made a decision, enabling post-mortem analysis if something goes wrong.</li>
      <li style="margin-bottom:8px;"><strong>Human-in-the-Loop:</strong> Ensuring that critical AI decisions (like approving a loan) are reviewed by a human before being finalized.</li>
    </ul>
    <div class="info-box"><div class="info-box-title">Governance vs. Regulation</div><p>Governance is what a company does internally to police itself. Regulation is what governments impose externally. Good governance helps companies avoid regulatory fines.</p></div>
  `,
  'AI Regulation': `
    <h2>Overview</h2>
    <p>AI Regulation refers to the legal frameworks established by governments to control the development, deployment, and sale of artificial intelligence systems. The goal is to protect citizens from harm while fostering innovation.</p>
    <h2>The Global Regulatory Landscape</h2>
    <h3>The European Union (EU AI Act)</h3>
    <p>The EU is taking the strictest approach with its AI Act, which categorizes AI systems by risk. "Unacceptable risk" AIs (like social scoring systems) are banned. "High-risk" AIs (like biometric identification or critical infrastructure) face strict requirements for data quality and human oversight.</p>
    <h3>United States</h3>
    <p>The US has favored a more decentralized, sector-specific approach. The Biden Administration issued an Executive Order on AI, but heavy lifting is left to agencies like the FTC and agencies guiding AI use in specific sectors like health and transportation.</p>
    <h3>China</h3>
    <p>China has implemented strict rules requiring AI generated content to be watermarked, and algorithms must be registered with the government. The state maintains heavy censorship over AI outputs.</p>
    <div class="info-box"><div class="info-box-title">The Compliance Challenge</div><p>For AI companies, navigating these differing global laws is a nightmare. An AI feature legal in the US might be illegal in the EU, forcing companies to geo-fence their AI capabilities or maintain entirely different models for different regions.</p></div>
  `,
  'AI in Healthcare': `
    <h2>Overview</h2>
    <p>Artificial Intelligence is revolutionizing healthcare by enhancing diagnostics, personalizing treatment, accelerating drug discovery, and streamlining administrative workflows. It is one of the most promising fields for AI to directly save human lives.</p>
    <h2>Key Applications</h2>
    <h3>Medical Imaging</h3>
    <p>Computer vision models can analyze X-rays, MRIs, and CT scans to detect anomalies—like early-stage tumors or fractures—often with higher accuracy and speed than human radiologists. This reduces fatigue-induced errors.</p>
    <h3>Drug Discovery</h3>
    <p>Traditionally, discovering a new drug takes 10-15 years and billions of dollars. AI models (like DeepMind's AlphaFold) can predict protein structures in minutes, allowing scientists to identify promising drug candidates in silico rather than through years of physical trial and error.</p>
    <h3>Predictive Analytics</h3>
    <p>Hospitals use ML algorithms to predict patient deterioration, sepsis risk, or readmission probabilities, allowing medical staff to intervene before a crisis occurs.</p>
    <div class="info-box"><div class="info-box-title">The AI-Human Partnership</div><p>In healthcare, AI is not meant to replace doctors, but to augment them. An AI can highlight a suspicious shadow on an X-ray, but the radiologist makes the final call. This "human-in-the-loop" approach is critical for patient safety and legal liability.</p></div>
  `,
  'AI in Finance': `
    <h2>Overview</h2>
    <p>The financial sector was one of the earliest adopters of AI. From algorithmic trading to fraud detection, AI processes massive datasets in milliseconds, enabling smarter, faster, and more secure financial decisions.</p>
    <h2>Key Applications</h2>
    <h3>Fraud Detection</h3>
    <p>Banks use machine learning to monitor millions of transactions in real-time. The AI establishes a baseline of normal behavior for each customer. If a card suddenly used in a different country for an unusual purchase, the AI instantly flags or blocks it.</p>
    <h3>Algorithmic Trading</h3>
    <p>Hedge funds use AI to analyze market trends, news sentiment, and historical data to execute trades at superhuman speeds. These models can identify arbitrage opportunities that last only fractions of a second.</p>
    <h3>Credit Scoring</h3>
    <p>AI expands traditional credit scoring by analyzing alternative data—like utility payments or even smartphone usage patterns—to assess the creditworthiness of individuals with thin credit files.</p>
    <h3>Robo-Advisors</h3>
    <p>Platforms like Betterment and Wealthfront use AI to provide automated, algorithm-driven financial planning services with little to no human supervision, democratizing access to portfolio management.</p>
    <div class="info-box"><div class="info-box-title">Systemic Risk</div><p>A major concern in AI finance is "flash crashes." If multiple trading algorithms react to the same market signal simultaneously, it can trigger an automated sell-off, crashing the market in seconds before humans can intervene.</p></div>
  `,
  'AI in Education': `
    <h2>Overview</h2>
    <p>AI is transforming education by providing personalized learning experiences, automating administrative tasks for teachers, and creating new ways for students to interact with information.</p>
    <h2>Key Applications</h2>
    <h3>Personalized Learning</h3>
    <p>AI tutors can adapt to a student's individual pace and learning style. If a student struggles with algebra but excels in geometry, the AI will dynamically adjust the curriculum, providing extra algebra practice without holding them back in geometry.</p>
    <h3>Automated Grading</h3>
    <p>Teachers spend countless hours grading. AI can instantly grade multiple-choice tests and is increasingly capable of evaluating essays, checking for grammar, structure, and even logical flow, freeing teachers to focus on actual instruction.</p>
    <h3>Accessibility</h3>
    <p>AI tools like real-time captioning, text-to-speech, and automated translation make educational materials accessible to students with disabilities and non-native speakers.</p>
    <div class="info-box"><div class="info-box-title">The ChatGPT Challenge</div><p>The rise of generative AI has forced educators to rethink assessment. Traditional take-home essays are increasingly obsolete, as students can generate high-quality text in seconds. Schools are shifting toward in-class writing, oral exams, and project-based learning.</p></div>
  `,
  'AI in Agriculture': `
    <h2>Overview</h2>
    <p>Artificial Intelligence is bringing the farming industry into the 21st century. By leveraging computer vision, IoT sensors, and predictive analytics, AI helps farmers increase crop yields, reduce chemical usage, and optimize resources.</p>
    <h2>Key Applications</h2>
    <h3>Precision Farming</h3>
    <p>Instead of treating an entire field the same way, AI uses drone imagery and satellite data to assess crop health at a micro-level. Farmers can identify exactly which parts of a field need water, fertilizer, or pesticide, reducing waste and environmental runoff.</p>
    <h3>Autonomous Machinery</h3>
    <p>Self-driving tractors and robotic harvesters use computer vision to navigate fields, plant seeds with perfect spacing, and pick ripe fruit without damaging the plants, addressing severe agricultural labor shortages.</p>
    <h3>Pest and Disease Detection</h3>
    <p>AI apps allow farmers to snap a photo of a sick plant on their smartphone. The computer vision model instantly identifies the pest or disease and recommends the correct treatment.</p>
    <div class="info-box"><div class="info-box-title">Yield Prediction</div><p>By analyzing weather patterns, soil data, and historical yields, AI can accurately predict crop output months in advance. This helps farmers negotiate better prices and stabilizes global food supply chains.</p></div>
  `,
  'AI in Manufacturing': `
    <h2>Overview</h2>
    <p>Manufacturing has always been at the forefront of automation, but AI is upgrading factories from "automated" to "intelligent." Industry 4.0 relies heavily on AI to optimize efficiency, safety, and quality control.</p>
    <h2>Key Applications</h2>
    <h3>Predictive Maintenance</h3>
    <p>Instead of fixing machines when they break (reactive) or on a fixed schedule (preventive), AI uses data from vibration and temperature sensors to predict exactly when a machine will fail. This prevents costly, unexpected downtime.</p>
    <h3>Quality Control (Computer Vision)</h3>
    <p>High-speed cameras paired with computer vision algorithms inspect products on the assembly line in milliseconds. They can spot microscopic defects in circuit boards or misaligned labels that human inspectors would miss due to eye fatigue.</p>
    <h3>Cobots</h3>
    <p>Collaborative robots, or "cobots," are designed to work safely alongside humans. Unlike traditional robots locked in cages, cobots use AI to detect human presence and slow down or stop, preventing accidents.</p>
    <div class="info-box"><div class="info-box-title">Digital Twins</div><p>Manufacturers create "Digital Twins"—virtual, AI-powered replicas of their entire factory. They can simulate changes to the production line in the digital world to see the impact before touching the physical factory.</p></div>
  `,
  'AI in Marketing': `
    <h2>Overview</h2>
    <p>AI has completely reshaped digital marketing. It allows brands to analyze vast amounts of consumer data, predict behavior, personalize content at scale, and optimize ad spend in real-time.</p>
    <h2>Key Applications</h2>
    <h3>Hyper-Personalization</h3>
    <p>AI algorithms track user behavior across the web to build detailed preference profiles. This allows platforms to serve highly targeted ads and product recommendations, drastically increasing conversion rates compared to generic marketing.</p>
    <h3>Generative Content</h3>
    <p>Marketers use LLMs to generate ad copy, blog posts, and social media updates. Image generation models are used to mock up ad creatives, A/B test visual concepts, and generate product photography without a camera.</p>
    <h3>Programmatic Advertising</h3>
    <p>AI automates the buying and selling of digital ad space in real-time. When a user loads a webpage, an AI auction occurs in milliseconds, determining which ad is most relevant to that specific user and placing the bid automatically.</p>
    <div class="info-box"><div class="info-box-title">Sentiment Analysis</div><p>Brands use NLP to scrape social media and news articles, analyzing the text to gauge public sentiment (positive, negative, or neutral) about their brand in real-time, allowing for rapid PR responses.</p></div>
  `,
  'AI in Gaming': `
    <h2>Overview</h2>
    <p>Artificial Intelligence has been intertwined with video games since the days of Pac-Man. Today, AI is used not just to control non-player characters (NPCs), but to generate entire worlds and assist human developers.</p>
    <h2>Key Applications</h2>
    <h3>Intelligent NPCs</h3>
    <p>Instead of following rigid, pre-programmed scripts, modern NPCs use reinforcement learning and behavior trees to adapt to player actions. They can learn player strategies, flank, take cover, and provide a dynamic challenge.</p>
    <h3>Procedural Content Generation</h3>
    <p>Games like *No Man's Sky* use AI algorithms to procedurally generate massive, infinite universes, planets, and creatures. This allows a small development team to create a game with more content than a human could manually build in a lifetime.</p>
    <h3>Dynamic Difficulty Adjustment</h3>
    <p>AI monitors a player's performance in real-time. If a player is struggling, the AI subtly reduces enemy health or accuracy. If the player is dominating, the AI increases the challenge, keeping the player in the psychological "flow state."</p>
    <div class="info-box"><div class="info-box-title">AI as a Developer Tool</div><p>Beyond in-game mechanics, studios use generative AI to concept art, write NPC dialogue, and write boilerplate code, drastically reducing development time and costs.</p></div>
  `,
  'AI in Customer Support': `
    <h2>Overview</h2>
    <p>Customer support has been transformed by AI. What used to require massive call centers of human agents is now largely handled by intelligent chatbots and automated ticketing systems, providing 24/7 support.</p>
    <h2>Key Applications</h2>
    <h3>Conversational Chatbots</h3>
    <p>Powered by Large Language Models, modern chatbots can understand complex customer queries, handle returns, process refunds, and troubleshoot technical issues without human intervention. They do not rely on rigid "press 1 for X" phone trees.</p>
    <h3>Sentiment Analysis & Routing</h3>
    <p>When a customer sends an angry email, NLP algorithms detect the high negative sentiment and automatically escalate the ticket to a specialized human retention team, prioritizing at-risk customers.</p>
    <h3>Agent Assist</h3>
    <p>Even when a human agent is on the line, AI works in the background. It transcribes the call in real-time, pulls up relevant knowledge base articles based on the customer's issue, and suggests responses to the human agent.</p>
    <div class="info-box"><div class="info-box-title">The Human Touch</div><p>While AI handles tier-1 support flawlessly, complex, emotionally sensitive, or highly frustrated customers still require human empathy. The best support systems seamlessly hand off to humans when the AI detects it is out of its depth.</p></div>
  `,
  'AI Trends': `
    <h2>Overview</h2>
    <p>The field of Artificial Intelligence moves at breakneck speed. Staying current with AI trends is essential for professionals and businesses looking to leverage new technologies and remain competitive.</p>
    <h2>Current Major Trends</h2>
    <h3>1. The Rise of Small Language Models (SLMs)</h3>
    <p>While massive models like GPT-4 dominate headlines, there is a massive trend toward smaller, highly efficient models (like Llama 3 8B or Mistral). These SLMs can run locally on laptops and smartphones, offering privacy and zero API costs.</p>
    <h3>2. Agentic Workflows</h3>
    <p>Moving beyond simple chat, developers are building AI "agents" that can autonomously execute multi-step tasks across different software applications, acting as digital employees.</p>
    <h3>3. Open-Source Dominance</h3>
    <p>Open-source AI models are closing the gap with proprietary models at an astonishing rate. Companies are increasingly fine-tuning open models on their private data rather than sending data to OpenAI or Google.</p>
    <h3>4. Multimodal Everything</h3>
    <p>Text-only AI is fading. The trend is toward real-time, multimodal models that can see video, hear audio, and read text simultaneously, enabling real-time video translation and visual assistants.</p>
    <div class="info-box"><div class="info-box-title">Enterprise Trend: RAG</div><p>Retrieval-Augmented Generation (RAG) is the hottest enterprise trend. It allows companies to securely chat with their own internal documents without needing to retrain the underlying AI model.</p></div>
  `,
  'Future of AI': `
    <h2>Overview</h2>
    <p>Predicting the future of AI is notoriously difficult, but current trajectories point toward a world where AI is invisible, ubiquitous, and deeply integrated into every aspect of human life and physical infrastructure.</p>
    <h2>Near-Term Future (1-5 Years)</h2>
    <h3>AI as a Utility</h3>

  `,

  // ==========================================
  // CATEGORY: LARGE LANGUAGE MODELS (LLM)
  // ==========================================
  'What is an LLM?': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>A Large Language Model (LLM) is a type of artificial intelligence algorithm that uses deep learning techniques and massively large data sets to understand, summarize, generate, and predict new content.</p></div>
    <h2>The "Large" in LLM</h2>
    <p>The term "large" refers to two main factors:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Parameters:</strong> The model contains billions or even trillions of parameters (the numerical weights the model adjusts during training). More parameters generally mean a greater capacity to understand complex language.</li>
      <li style="margin-bottom:8px;"><strong>Training Data:</strong> LLMs are trained on massive portions of the internet, including books, articles, websites, and code repositories.</li>
    </ul>
    <h2>What Can LLMs Do?</h2>
    <p>LLMs are incredibly versatile. Because they are trained on general language patterns, they can be adapted to perform a wide variety of tasks without being explicitly programmed for them (a concept known as zero-shot or few-shot learning). Common use cases include:</p>
    <h3>Text Generation</h3>
    <p>Writing essays, emails, code, and creative fiction based on a simple prompt.</p>
    <h3>Summarization</h3>
    <p>Taking long documents and distilling them into concise bullet points or executive summaries.</p>
    <h3>Translation</h3>
    <p>Converting text from one language to another with high contextual accuracy.</p>
    <h3>Question Answering</h3>
    <p>Functioning as chatbots or virtual assistants that can answer complex questions conversationally.</p>
    <h2>How LLMs Differ from Traditional AI</h2>
    <p>Traditional Natural Language Processing (NLP) required specific models for specific tasks. You needed one model for translation and another for summarization. An LLM, however, acts as a foundation model that can handle almost any language task through a single interface.</p>
  `,
  'How LLMs Work': `
    <h2>Overview</h2>
    <p>At their core, Large Language Models work by predicting the next most likely word (or token) in a sequence. While this sounds simple, the mathematics and scale behind this prediction enable complex reasoning and generation.</p>
    <h2>The Transformer Architecture</h2>
    <p>Modern LLMs are built on a neural network architecture called the Transformer, introduced in the 2017 paper "Attention Is All You Need." The Transformer revolutionized AI by allowing models to process entire sequences of text simultaneously, rather than sequentially.</p>
    <h3>The Attention Mechanism</h3>
    <p>The secret sauce of the Transformer is "Self-Attention." When processing a word, the model doesn't just look at the word itself; it looks at every other word in the sentence to understand the context.</p>
    <div class="info-box"><div class="info-box-title">Example</div><p>In the sentence "The bank of the river was muddy," the word "bank" could mean a financial institution or the side of a river. The attention mechanism allows the model to strongly associate "bank" with "river," ensuring it understands the correct meaning.</p></div>
    <h2>The Training Process</h2>
    <p>Training an LLM happens in two main phases:</p>
    <h3>1. Pre-training</h3>
    <p>The model is exposed to terabytes of raw text. It plays a massive game of "fill in the blank," trying to predict missing words. Over time, it learns grammar, facts, reasoning abilities, and coding skills. This phase requires immense computational power and months of processing.</p>
    <h3>2. Fine-tuning</h3>
    <p>A pre-trained model is raw and often unhelpful. Fine-tuning involves training it on specific, high-quality conversational data. This is where techniques like RLHF (Reinforcement Learning from Human Feedback) are used to make the model helpful, polite, and safe.</p>
    <h2>Generation (Inference)</h2>
    <p>When you ask an LLM a question, it converts your prompt into tokens. It then calculates the mathematical probability of what the next token should be, selects one, adds it to your prompt, and repeats the process until the answer is complete. It is essentially an incredibly sophisticated autocomplete.</p>
  `,
  'Tokens': `
    <h2>Overview</h2>
    <p>In the context of Large Language Models, a token is the fundamental unit of data that the model processes. It is a chunk of text—usually a word, a part of a word, or even a single character—that the AI reads and generates.</p>
    <h2>Words vs. Tokens</h2>
    <p>It is a common misconception that one word equals one token. In reality, LLMs use complex dictionaries (tokenizers) that break words down into sub-words. This helps the model understand root words, prefixes, and suffixes, and allows it to handle rare words or typos.</p>
    <div class="info-box"><div class="info-box-title">Rule of Thumb</div><p>For standard English text, 1 token is approximately 4 characters, or roughly 3/4 of a word. Therefore, 100 tokens ≈ 75 words.</p></div>
    <h2>Examples of Tokenization</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>"Apple"</strong> → 1 Token</li>
      <li style="margin-bottom:8px;"><strong>"Hamburger"</strong> → Might be split into "Ham" + "burger" (2 Tokens)</li>
      <li style="margin-bottom:8px;"><strong>"Unbelievable"</strong> → Might be split into "Un" + "believe" + "able" (3 Tokens)</li>
    </ul>
    <h2>Why Tokens Matter</h2>
    <h3>1. Cost</h3>
    <p>If you are using commercial LLM APIs (like OpenAI's GPT-4), you are charged based on the number of tokens you send in your prompt and the number of tokens the model generates in its response.</p>
    <h3>2. Context Limits</h3>
    <p>Every LLM has a "Context Window"—a maximum number of tokens it can hold in its working memory at one time. If your prompt and the expected response exceed this limit, the model will "forget" the beginning of the text. Understanding token limits is crucial for processing long documents.</p>
    <h2>Languages and Tokens</h2>
    <p>Tokenizers are usually optimized for English. Non-English languages often require more tokens to express the same idea. For example, a Spanish sentence might use 20% more tokens than its English translation, making it slower to process and more expensive for API users.</p>
  `,
  'Embeddings': `
    <h2>Overview</h2>
    <p>Embeddings are a way to represent words, sentences, or even entire documents as arrays of numbers (vectors) in a high-dimensional space. This translation allows computers to understand the semantic meaning of text.</p>
    <h2>From Text to Numbers</h2>
    <p>Computers cannot inherently understand text; they only process numbers. Early AI represented words using simple methods like "One-Hot Encoding," where every word was assigned a unique ID. However, this method didn't capture any meaning—the word "King" was just as mathematically distant from "Queen" as it was from "Apple."</p>
    <h2>The Magic of Semantic Space</h2>
    <p>Embeddings solve this by placing words into a multi-dimensional space (often hundreds or thousands of dimensions). Words that share similar contexts or meanings are positioned close together in this space.</p>
    <h3>Famous Example: King - Man + Woman = Queen</h3>
    <p>Because embeddings capture concepts like gender and royalty, you can perform math on them. If you take the vector for "King", subtract the vector for "Man", and add the vector for "Woman", the closest resulting vector in the space will be "Queen".</p>
    <div class="info-box"><div class="info-box-title">Practical Application</div><p>Embeddings power modern search engines. Instead of matching exact keywords, search engines convert your query into an embedding and find documents with mathematically similar embeddings, even if they use entirely different words.</p></div>
    <h2>How Embeddings are Used in LLMs</h2>
    <p>Before an LLM processes your prompt, it must convert the tokens into embeddings. This embedding layer is the very first step in the model's neural network. It provides the foundational "understanding" of what the words mean before the Transformer layers begin analyzing their relationships.</p>
  `,
  'Retrieval-Augmented Generation (RAG)': `
    <h2>Overview</h2>
    <p>Retrieval-Augmented Generation (RAG) is an AI framework that improves the quality and accuracy of Large Language Models by fetching facts from an external knowledge base before generating an answer. It acts as an open-book exam for AI.</p>
    <h2>The Problem RAG Solves</h2>
    <p>Standard LLMs rely solely on the information they were trained on. This leads to two major issues:</p>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Hallucinations:</strong> If the model doesn't know an answer, it may confidently make one up.</li>
      <li style="margin-bottom:8px;"><strong>Outdated Info:</strong> An LLM trained in 2022 cannot know about events that happened in 2024.</li>
      <li style="margin-bottom:8px;"><strong>Private Data:</strong> The model doesn't know your company's internal documents.</li>
    </ul>
    <h2>How RAG Works</h2>
    <p>RAG introduces a retrieval step before the generation step. The process is as follows:</p>
    <h3>1. Document Ingestion & Embedding</h3>
    <p>You take a large set of documents (e.g., your company's wiki), break them into chunks, and convert those chunks into vector embeddings. These are stored in a Vector Database.</p>
    <h3>2. User Query</h3>
    <p>The user asks a question. The system converts the user's question into an embedding as well.</p>
    <h3>3. Retrieval</h3>
    <p>The system compares the user's question embedding against all the document embeddings in the database. It retrieves the top 3-5 most mathematically similar document chunks.</p>
    <h3>4. Generation</h3>
    <p>The system sends a new prompt to the LLM that says: "Using only the following context, answer the user's question." It includes the retrieved document chunks and the original question. The LLM reads the context and generates an accurate, grounded answer.</p>
    <div class="info-box"><div class="info-box-title">Key Benefit</div><p>RAG allows you to build highly accurate, domain-specific AI chatbots without needing to spend millions of dollars retraining the foundational LLM from scratch.</p></div>
    <h2>Best Practices for RAG</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;">Chunk your documents logically (e.g., by paragraph or section) rather than by arbitrary character counts.</li>
      <li style="margin-bottom:8px;">Always ask the LLM to cite its sources or quote the text it used.</li>
      <li style="margin-bottom:8px;">Use hybrid search (combining keyword search with vector search) for better retrieval accuracy.</li>
    </ul>
  `,

  'Context Window': `
    <div class="info-box"><div class="info-box-title">Overview</div><p>The context window is the maximum amount of text—measured in tokens—that a Large Language Model can process and "remember" in a single interaction. It acts as the model's short-term memory.</p></div>
    <h2>The Limits of Memory</h2>
    <p>Unlike humans, who can recall conversations from years ago, LLMs are stateless. They only know what is inside their current context window. If a conversation exceeds this limit, the model will "forget" the earliest messages, leading to a loss of context and potentially contradicting earlier statements.</p>
    <h2>Why It Matters</h2>
    <h3>1. Cost</h3>
    <p>When using commercial APIs, you are charged based on the number of tokens processed. A larger context window means you are sending and receiving more tokens per interaction, significantly increasing costs.</p>
    <h3>2. Performance</h3>
    <p>While it seems like bigger is always better, models with massive context windows can suffer from the "lost in the middle" phenomenon. They may pay more attention to the very beginning and very end of the prompt, ignoring crucial details buried in the middle.</p>
    <h2>The Push for Larger Windows</h2>
    <p>Early LLMs had context windows of around 2,000 tokens (a few pages of text). Today, models like Gemini 1.5 Pro boast context windows of up to 1 million or even 2 million tokens, allowing users to upload entire books, hours of video, or large codebases in a single prompt.</p>
    <div class="info-box"><div class="info-box-title">Practical Tip</div><p>If you are building an app that requires processing massive documents, consider using techniques like Map-Reduce or Retrieval-Augmented Generation (RAG) instead of forcing the entire document into the context window at once.</p></div>
  `,
  'Prompt Engineering': `
    <h2>Overview</h2>
    <p>Prompt Engineering is the practice of designing and refining the inputs (prompts) given to a Large Language Model to achieve optimal, accurate, and relevant outputs. It is part art, part science, and currently the most accessible way to control AI behavior.</p>
    <h2>Key Techniques</h2>
    <h3>1. Zero-Shot Prompting</h3>
    <p>This is the simplest form: you ask the model to do something without providing any examples. "Translate 'Hello' to French" relies on the model's pre-existing training.</p>
    <h3>2. Few-Shot Prompting</h3>
    <p>Here, you provide a few examples within the prompt to guide the model's output format and tone. For example, showing three examples of a positive/negative sentiment analysis before asking it to analyze a new sentence.</p>
    <h3>3. Role-Playing</h3>
    <p>Assigning a persona to the model drastically changes its output. Starting a prompt with "You are an expert software engineer reviewing code for security vulnerabilities" sets a highly specific context.</p>
    <h2>Best Practices</h2>
    <ul style="margin-bottom:16px; padding-left:20px;">
      <li style="margin-bottom:8px;"><strong>Be Specific:</strong> Vague prompts yield vague results. Instead of "Write a blog post," use "Write a 500-word blog post about AI safety for a general audience, focusing on bias and transparency."</li>
      <li style="margin-bottom:8px;"><strong>Use Delimiters:</strong> Use triple quotes ("""), XML tags (<text>), or markdown (###) to separate instructions from the data the model needs to process.</li>
      <li style="margin-bottom:8px;"><strong>Specify the Output Format:</strong> If you want JSON, CSV, or a specific list format, tell the model explicitly. "Output your response as a JSON object with 'title' and 'summary' keys."</li>
    </ul>

    from worker-dashboard.html — don't edit the ad unit IDs.

    Once a-ads.com marks units 2450890 and 2450888 as verified:
      1. Delete this file (or blank it out).
      2. Remove its <url> entry from sitemap.xml.
      3. Remove its "Allow:" line from robots.txt.
      4. Remove the temporary footer link added to every page (search
         for "TEMP: a-ads verification link" across the site).

    there's nothing to "move back" — it's been running there the whole

<script>
  /* Navbar blur on scroll */
  const navbar = document.getElementById("navbar");
  window.addEventListener("scroll", () => {
    navbar.style.background = window.scrollY > 20 ? "rgba(6,10,18,.85)" : "rgba(6,10,18,.72)";
  });

  /* Mobile Nav Toggle */
  const toggle = document.getElementById("navToggle");
  const menu = document.getElementById("mobileMenu");
  if (toggle && menu) {
    toggle.addEventListener("click", () => {
      menu.classList.toggle("open");
      toggle.textContent = menu.classList.contains("open") ? "✕" : "☰";
    });
    menu.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        menu.classList.remove("open");
        toggle.textContent = "☰";
      });
    });
  }
</script>

  <!--
    PERMANENT UTILITY PAGE — a-ads.com ad-unit verification.

    Why this page exists: any ad unit that lives inside a login-gated
    page (like worker-dashboard.html, behind script.js -> protectPage())
    can't be verified by a-ads.com's bot, because the bot can't log in
    and just hits the redirect to login.html instead. a-ads support's
    fix is to have the exact same ad unit's <iframe> code sitting on
    some public, unauthenticated page they CAN crawl.

    So this page is kept around on purpose as that public page, for
    reuse any time a new gated ad unit needs verifying:

      1. Copy the new unit's <iframe data-aa='...'> block (verbatim,
         same ID) from wherever it actually lives into the
         .ad-showcase section below, alongside whatever's already here.
      2. In the a-ads dashboard, point that unit's verification URL at
         https://harmoniaportal.online/ad-partners.html
      3. Once a-ads marks it verified, you can leave the block here
         (harmless) or remove it — either way, the "real" copy of the
         ad code in its actual gated page was never touched by any of
         this, so there's nothing to move back.

    Units currently listed here for reference: 2450888, 2450890
    (both live in worker-dashboard.html).
  -->
  <meta name="robots" content="noindex, follow">

  <title>Advertising Partners | Harmonia</title>
  <meta name="description" content="Harmonia's advertising partners.">

  <link rel="canonical" href="https://harmoniaportal.online/ad-partners.html">

<script src="script.js?v=20260802"></script>

<script>
  /* Navbar blur on scroll */
  const navbar = document.getElementById("navbar");
  window.addEventListener("scroll", () => {
    navbar.style.background = window.scrollY > 20 ? "rgba(6,10,18,.85)" : "rgba(6,10,18,.72)";
  });

  /* Mobile Nav Toggle */
  const toggle = document.getElementById("navToggle");
  const menu = document.getElementById("mobileMenu");
  if (toggle && menu) {
    toggle.addEventListener("click", () => {
      menu.classList.toggle("open");
      toggle.textContent = menu.classList.contains("open") ? "✕" : "☰";
    });
    menu.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        menu.classList.remove("open");
        toggle.textContent = "☰";
      });
    });
  }
</script>
